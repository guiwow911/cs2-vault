<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 Vault — 模拟开箱</title>
  <link rel="icon" href="https://community.akamai.steamstatic.com/public/images/skin_viewer/cs2/csgo_logo_dark_8.png" />
  <style>
    /* ─── Reset & Variables ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0e12;
      --surface:   #161820;
      --surface2:  #1e2030;
      --border:    #2a2d3e;
      --accent:    #e8a838;
      --accent2:   #f0c060;
      --text:      #e0e0e0;
      --muted:     #888;
      --danger:    #e84343;
      --success:   #43e87a;

      --rarity-consumer:     #b0c3d9;
      --rarity-industrial:   #5e98d9;
      --rarity-milspec:      #4b69ff;
      --rarity-restricted:   #8847ff;
      --rarity-classified:   #d32ce6;
      --rarity-covert:       #eb4b4b;
      --rarity-contraband:   #e4ae39;
      --rarity-gold:         #ffd700;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ─── Header ────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 64px;
      background: rgba(13,14,18,.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .05em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .logo svg { width: 32px; height: 32px; }
    .wallet {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
    .balance {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }
    .btn-add { cursor: pointer; background: var(--surface2); border: 1px solid var(--border); color: var(--accent); padding: 6px 14px; border-radius: 6px; font-size: 13px; transition: background .2s; }
    .btn-add:hover { background: var(--border); }

    /* ─── Navigation Tabs ───────────────────────────────── */
    .nav-tabs {
      display: flex;
      gap: 4px;
      padding: 16px 24px 0;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .nav-tab {
      padding: 10px 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 2px solid transparent;
      transition: color .2s, border-color .2s;
      white-space: nowrap;
    }
    .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .nav-tab:hover { color: var(--text); }

    /* ─── Pages ─────────────────────────────────────────── */
    .page { display: none; padding: 24px; }
    .page.active { display: block; }

    /* ─── Cases Grid ─────────────────────────────────────── */
    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--accent);
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .search-bar input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    .search-bar input:focus { border-color: var(--accent); }
    .cases-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }
    .case-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: transform .2s, border-color .2s, box-shadow .2s;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .case-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(232,168,56,.08), transparent);
      opacity: 0;
      transition: opacity .2s;
    }
    .case-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 8px 24px rgba(232,168,56,.15); }
    .case-card:hover::before { opacity: 1; }
    .case-card img {
      width: 120px;
      height: 90px;
      object-fit: contain;
      margin: 0 auto 12px;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.5));
    }
    .case-name { font-size: 13px; font-weight: 600; line-height: 1.4; margin-bottom: 8px; }
    .case-price { font-size: 14px; font-weight: 700; color: var(--accent); }
    .case-type-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: .05em;
      background: rgba(232,168,56,.2);
      color: var(--accent);
    }

    /* ─── Open Box Modal ─────────────────────────────────── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 200;
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 90vw;
      max-width: 900px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 28px;
      position: relative;
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
      line-height: 1;
      transition: color .2s;
    }
    .modal-close:hover { color: var(--danger); }
    .modal-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .modal-case-img { width: 120px; height: 90px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,.6)); }
    .modal-title { font-size: 22px; font-weight: 800; color: var(--accent); }
    .modal-subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }

    /* ─── Contains List ──────────────────────────────────── */
    .contains-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .contains-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    .contains-item {
      background: var(--surface2);
      border-radius: 8px;
      padding: 10px 8px;
      text-align: center;
      border: 1px solid transparent;
      transition: border-color .2s;
    }
    .contains-item:hover { border-color: var(--border); }
    .contains-item img { width: 72px; height: 54px; object-fit: contain; margin: 0 auto 6px; display: block; }
    .contains-item .item-name { font-size: 10px; line-height: 1.3; color: var(--text); }
    .contains-item .item-rarity-bar {
      height: 2px;
      border-radius: 2px;
      margin-top: 6px;
    }

    /* ─── Open Controls ──────────────────────────────────── */
    .open-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .open-count-btns { display: flex; gap: 6px; }
    .count-btn {
      padding: 8px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, border-color .2s;
    }
    .count-btn.active, .count-btn:hover { background: rgba(232,168,56,.15); border-color: var(--accent); color: var(--accent); }
    .btn-open {
      flex: 1;
      min-width: 160px;
      padding: 12px 24px;
      background: linear-gradient(135deg, #e8a838, #f0c060);
      color: #1a1200;
      font-size: 16px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: .05em;
      text-transform: uppercase;
      transition: filter .2s, transform .15s;
    }
    .btn-open:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-open:active { transform: translateY(0); }
    .open-cost { font-size: 13px; color: var(--muted); }

    /* ─── Spin Animation ─────────────────────────────────── */
    .spin-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.92);
      z-index: 300;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .spin-overlay.open { display: flex; }
    .spin-track-wrap {
      width: 100%;
      max-width: 800px;
      overflow: hidden;
      padding: 0 20px;
      position: relative;
    }
    .spin-track-wrap::before,
    .spin-track-wrap::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 120px;
      z-index: 2;
      pointer-events: none;
    }
    .spin-track-wrap::before { left: 20px; background: linear-gradient(to right, rgba(0,0,0,.9), transparent); }
    .spin-track-wrap::after  { right: 20px; background: linear-gradient(to left, rgba(0,0,0,.9), transparent); }
    .spin-pointer {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      background: var(--accent);
      z-index: 5;
      box-shadow: 0 0 16px var(--accent);
    }
    .spin-pointer::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-top-color: var(--accent);
    }
    .spin-pointer::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 8px solid transparent;
      border-bottom-color: var(--accent);
    }
    .spin-track {
      display: flex;
      gap: 8px;
      transition: transform 4s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: transform;
      padding: 0 50%;
    }
    .spin-item {
      flex-shrink: 0;
      width: 140px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
    }
    .spin-item img { width: 100px; height: 75px; object-fit: contain; display: block; margin: 0 auto 6px; }
    .spin-item .spin-name { font-size: 11px; font-weight: 600; line-height: 1.3; }

    /* ─── Result ─────────────────────────────────────────── */
    .spin-result {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 32px;
      text-align: center;
    }
    .spin-result.show { display: flex; }
    .result-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 32px 48px;
      border: 2px solid;
      position: relative;
      overflow: hidden;
    }
    .result-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: .08;
      background: radial-gradient(circle at center, currentColor, transparent 70%);
    }
    .result-card img { width: 200px; height: 150px; object-fit: contain; display: block; margin: 0 auto 16px; filter: drop-shadow(0 8px 20px rgba(0,0,0,.6)); }
    .result-name { font-size: 22px; font-weight: 800; }
    .result-rarity { font-size: 14px; font-weight: 600; margin-top: 4px; letter-spacing: .08em; text-transform: uppercase; }
    .result-wear { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .result-float { font-size: 12px; color: var(--muted); }
    .result-actions { display: flex; gap: 12px; }
    .btn-sell { padding: 10px 24px; background: var(--surface2); border: 1px solid var(--border); color: var(--success); font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: background .2s; }
    .btn-sell:hover { background: rgba(67,232,122,.1); border-color: var(--success); }
    .btn-again { padding: 10px 24px; background: linear-gradient(135deg, #e8a838, #f0c060); color: #1a1200; font-size: 14px; font-weight: 800; border: none; border-radius: 8px; cursor: pointer; transition: filter .2s; }
    .btn-again:hover { filter: brightness(1.1); }
    .btn-close-result { padding: 10px 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-size: 14px; border-radius: 8px; cursor: pointer; }
    .btn-close-result:hover { color: var(--text); border-color: var(--text); }

    /* Multi-open results */
    .multi-results { margin-top: 32px; text-align: center; }
    .multi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin: 16px 0; }
    .multi-item {
      background: var(--surface);
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      border: 2px solid;
      animation: fadeIn .3s ease forwards;
      opacity: 0;
    }
    @keyframes fadeIn { to { opacity: 1; } }
    .multi-item img { width: 90px; height: 68px; object-fit: contain; display: block; margin: 0 auto 8px; }
    .multi-item .m-name { font-size: 11px; font-weight: 600; line-height: 1.3; }
    .multi-item .m-wear { font-size: 10px; color: var(--muted); margin-top: 2px; }

    /* ─── Inventory Page ─────────────────────────────────── */
    .inv-stats {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .inv-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 20px;
      min-width: 140px;
    }
    .inv-stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    .inv-stat-value { font-size: 22px; font-weight: 800; color: var(--accent); margin-top: 4px; }
    .inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
    .inv-item {
      background: var(--surface);
      border: 2px solid;
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      position: relative;
    }
    .inv-item:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,.4); }
    .inv-item img { width: 90px; height: 68px; object-fit: contain; display: block; margin: 0 auto 8px; }
    .inv-item .i-name { font-size: 11px; font-weight: 600; line-height: 1.3; }
    .inv-item .i-wear { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .inv-item .i-float { font-size: 9px; color: var(--muted); }
    .inv-sell-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(67,232,122,.15);
      border: none;
      border-radius: 4px;
      color: var(--success);
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      cursor: pointer;
      display: none;
      transition: background .2s;
    }
    .inv-item:hover .inv-sell-btn { display: block; }
    .inv-sell-btn:hover { background: rgba(67,232,122,.3); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty-state svg { width: 64px; height: 64px; opacity: .3; margin: 0 auto 16px; display: block; }
    .empty-state p { font-size: 16px; }
    .inv-filter { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-btn { padding: 6px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; color: var(--muted); font-size: 12px; cursor: pointer; transition: all .2s; }
    .filter-btn.active, .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(232,168,56,.1); }

    /* ─── History Page ───────────────────────────────────── */
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    .history-item {
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      animation: slideIn .3s ease;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .history-item img { width: 64px; height: 48px; object-fit: contain; flex-shrink: 0; }
    .history-item-info { flex: 1; }
    .history-item-name { font-size: 14px; font-weight: 700; }
    .history-item-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .history-item-rarity { width: 4px; align-self: stretch; border-radius: 4px; flex-shrink: 0; }
    .history-item-price { font-size: 15px; font-weight: 700; color: var(--success); }
    .history-time { font-size: 11px; color: var(--muted); flex-shrink: 0; }

    /* ─── Toast ──────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 500;
      transform: translateY(80px);
      opacity: 0;
      transition: transform .3s ease, opacity .3s ease;
      max-width: 300px;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--success); color: var(--success); }
    .toast.error   { border-color: var(--danger);  color: var(--danger); }

    /* ─── Loading ────────────────────────────────────────── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 16px;
      color: var(--muted);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Glow effects ───────────────────────────────────── */
    .glow-covert    { box-shadow: 0 0 20px rgba(235,75,75,.3); }
    .glow-classified { box-shadow: 0 0 20px rgba(211,44,230,.3); }
    .glow-restricted { box-shadow: 0 0 20px rgba(136,71,255,.25); }
    .glow-milspec   { box-shadow: 0 0 15px rgba(75,105,255,.2); }

    /* ─── Scrollbar ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (max-width: 600px) {
      .cases-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .modal { padding: 20px; }
      .modal-header { flex-direction: column; text-align: center; }
      .spin-item { width: 120px; }
      .result-card { padding: 20px 24px; }
    }
  </style>
</head>
<body>

<!-- ─── Header ────────────────────────────────────────────── -->
<header>
  <div class="logo">
    <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="16,2 30,10 30,22 16,30 2,22 2,10" fill="rgba(232,168,56,.15)" stroke="#e8a838" stroke-width="1.5"/>
      <polygon points="16,7 26,13 26,21 16,27 6,21 6,13" fill="rgba(232,168,56,.08)" stroke="#e8a838" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#e8a838"/>
    </svg>
    CS2 Vault
  </div>
  <div class="wallet">
    <span style="color:var(--muted);font-size:13px;">余额</span>
    <span class="balance" id="balance">$1,000.00</span>
    <button class="btn-add" onclick="addBalance()">+ 充值</button>
  </div>
</header>

<!-- ─── Nav Tabs ───────────────────────────────────────────── -->
<div class="nav-tabs">
  <div class="nav-tab active" onclick="showPage('cases')">🎁 武器箱</div>
  <div class="nav-tab" onclick="showPage('skins')">🔫 皮肤库</div>
  <div class="nav-tab" onclick="showPage('inventory')">🎒 我的背包</div>
  <div class="nav-tab" onclick="showPage('history')">📜 开箱记录</div>
</div>

<!-- ─── CASES PAGE ─────────────────────────────────────────── -->
<div class="page active" id="page-cases">
  <div class="section-title">选择武器箱</div>
  <div class="search-bar">
    <input type="text" id="case-search" placeholder="🔍  搜索武器箱…" oninput="filterCases()" />
  </div>
  <div id="cases-container">
    <div class="loading"><div class="spinner"></div><span>加载武器箱数据中…</span></div>
  </div>
</div>

<!-- ─── SKINS PAGE ─────────────────────────────────────────── -->
<div class="page" id="page-skins">
  <div class="section-title">皮肤库</div>
  <div class="search-bar">
    <input type="text" id="skin-search" placeholder="🔍  搜索皮肤…" oninput="filterSkins()" />
  </div>
  <div class="inv-filter" id="rarity-filters">
    <button class="filter-btn active" onclick="setRarityFilter('all', this)">全部</button>
    <button class="filter-btn" style="color:#eb4b4b;border-color:#eb4b4b40" onclick="setRarityFilter('covert', this)">Covert</button>
    <button class="filter-btn" style="color:#d32ce6;border-color:#d32ce640" onclick="setRarityFilter('classified', this)">Classified</button>
    <button class="filter-btn" style="color:#8847ff;border-color:#8847ff40" onclick="setRarityFilter('restricted', this)">Restricted</button>

<!-- ─── TOAST ─────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════
//  State
// ══════════════════════════════════════════════════════════
let balance   = parseFloat(localStorage.getItem('balance') || '1000');
let inventory = JSON.parse(localStorage.getItem('inventory') || '[]');
let history   = JSON.parse(localStorage.getItem('history') || '[]');
let openCount = parseInt(localStorage.getItem('openCount') || '0');

let allCases  = [];
let allSkins  = [];
let currentCase = null;
let openQty   = 1;
let lastOpened = null;
let lastOpenedMulti = null;
let rarityFilter = 'all';
let invFilter    = 'all';

// ── Rarity config ──
const RARITY_MAP = {
  rarity_consumer_weapon:   { label: 'Consumer Grade',  color: '#b0c3d9', key: 'consumer'   },
  rarity_common:            { label: 'Consumer Grade',  color: '#b0c3d9', key: 'consumer'   },
  rarity_uncommon_weapon:   { label: 'Industrial Grade',color: '#5e98d9', key: 'industrial' },
  rarity_rare_weapon:       { label: 'Mil-Spec Grade',  color: '#4b69ff', key: 'milspec'    },
  rarity_mythical_weapon:   { label: 'Restricted',      color: '#8847ff', key: 'restricted' },
  rarity_legendary_weapon:  { label: 'Classified',      color: '#d32ce6', key: 'classified' },
  rarity_ancient_weapon:    { label: 'Covert',          color: '#eb4b4b', key: 'covert'     },
  rarity_ancient:           { label: 'Covert',          color: '#eb4b4b', key: 'covert'     },
  rarity_contraband:        { label: 'Contraband',      color: '#e4ae39', key: 'contraband' },
};

const WEAR_NAMES = ['Factory New', 'Minimal Wear', 'Field-Tested', 'Well-Worn', 'Battle-Scarred'];

// Rarity drop weights (approximate CS2 real rates)
const RARITY_WEIGHTS = {
  consumer:   0,      // not in cases normally
  industrial: 0,
  milspec:    79.92,
  restricted: 15.98,
  classified: 3.2,
  covert:     0.64,
  contraband: 0.26,
};

// ══════════════════════════════════════════════════════════
//  Utilities
// ══════════════════════════════════════════════════════════
function save() {
  localStorage.setItem('balance', balance.toFixed(2));
  localStorage.setItem('inventory', JSON.stringify(inventory));
  localStorage.setItem('history', JSON.stringify(history));
  localStorage.setItem('openCount', openCount);
}
function fmt(n) { return '$' + parseFloat(n).toFixed(2); }
function updateBalance() {
  document.getElementById('balance').textContent = fmt(balance);
}
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => t.className = 'toast', 2800);
}
function addBalance() {
  balance += 100;
  save();
  updateBalance();
  showToast('+$100.00 已充值', 'success');
}
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.querySelectorAll('.nav-tab')[['cases','skins','inventory','history'].indexOf(id)].classList.add('active');
  if (id === 'inventory') renderInventory();
  if (id === 'history')   renderHistory();
}

// ══════════════════════════════════════════════════════════
//  Skin pricing (mock market prices based on rarity)
// ══════════════════════════════════════════════════════════
function mockPrice(rarity, wear) {
  const base = { consumer: 0.05, industrial: 0.1, milspec: 0.3, restricted: 1.2, classified: 8, covert: 45, contraband: 200 };
  const wearMult = [1.3, 1.15, 0.95, 0.75, 0.55];
  const wearIdx = WEAR_NAMES.indexOf(wear);
  const b = base[rarity] || 0.1;
  const mult = wearIdx >= 0 ? wearMult[wearIdx] : 1;
  return +(b * mult * (0.7 + Math.random() * 0.6)).toFixed(2);
}

function getCasePrice(c) {
  if (!c.contains || c.contains.length === 0) return 1.00;
  return 2.50;
}

// ══════════════════════════════════════════════════════════
//  Data Loading
// ══════════════════════════════════════════════════════════
const API_BASE = 'https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en';

async function loadData() {
  try {
    const [cratesRes, skinsRes] = await Promise.all([
      fetch(API_BASE + '/crates.json'),
      fetch(API_BASE + '/skins.json')
    ]);
    allCases = await cratesRes.json();
    allSkins  = await skinsRes.json();

    // Filter only real weapon cases/capsules with contents
    allCases = allCases.filter(c =>
      c.contains && c.contains.length > 0 &&
      (c.type === 'Case' || c.type === 'Capsule' || c.type === 'Souvenir')
    );

    renderCases(allCases);
    renderSkinsPage(allSkins);
  } catch (e) {
    document.getElementById('cases-container').innerHTML =
      `<div style="color:var(--danger);padding:40px;text-align:center;">⚠️ 数据加载失败，请刷新重试。<br><small>${e.message}</small></div>`;
  }
}

// ══════════════════════════════════════════════════════════
//  Cases Page
// ══════════════════════════════════════════════════════════
function renderCases(cases) {
  const grid = document.createElement('div');
  grid.className = 'cases-grid';
  grid.id = 'cases-grid';

  cases.forEach(c => {
    const price = getCasePrice(c);
    const div = document.createElement('div');
    div.className = 'case-card';
    div.innerHTML = `
      ${c.type ? `<div class="case-type-badge">${c.type}</div>` : ''}
      <img src="${c.image}" alt="${c.name}" loading="lazy" onerror="this.src='https://community.akamai.steamstatic.com/public/images/skin_viewer/cs2/csgo_logo_dark_8.png'"/>
      <div class="case-name">${c.name}</div>
      <div class="case-price">${fmt(price)}</div>
    `;
    div.onclick = () => openCaseModal(c);
    grid.appendChild(div);
  });

  const cont = document.getElementById('cases-container');
  cont.innerHTML = '';
  cont.appendChild(grid);
}

function filterCases() {
  const q = document.getElementById('case-search').value.toLowerCase();
  const filtered = allCases.filter(c => c.name.toLowerCase().includes(q));
  renderCases(filtered);
}

// ══════════════════════════════════════════════════════════
//  Case Modal
// ══════════════════════════════════════════════════════════
function openCaseModal(c) {
  currentCase = c;
  openQty = 1;
  document.querySelectorAll('.count-btn').forEach((b, i) => b.classList.toggle('active', i === 0));

  document.getElementById('modal-case-img').src = c.image;
  document.getElementById('modal-case-name').textContent = c.name;
  document.getElementById('modal-case-sub').textContent =
    `${c.type || 'Container'} · 首发 ${c.first_sale_date || '—'}`;

  // Contains
  const cont = document.getElementById('modal-contains');
  cont.innerHTML = '';
  (c.contains || []).forEach(item => {
    const r = RARITY_MAP[item.rarity?.id] || { color: '#888', label: '' };
    const d = document.createElement('div');
    d.className = 'contains-item';
    d.innerHTML = `
      <img src="${item.image}" alt="${item.name}" loading="lazy" onerror="this.src=''" />
      <div class="item-name">${item.name}</div>
      <div class="item-rarity-bar" style="background:${r.color}"></div>
    `;
    cont.appendChild(d);
  });

  // Rare / special items
  const rareEl = document.getElementById('modal-rare');
  const rareTitleEl = document.getElementById('rare-title');
  rareEl.innerHTML = '';
  if (c.contains_rare && c.contains_rare.length > 0) {
    rareTitleEl.style.display = '';
    c.contains_rare.forEach(item => {
      const r = RARITY_MAP[item.rarity?.id] || { color: '#ffd700', label: '' };
      const d = document.createElement('div');
      d.className = 'contains-item';
      d.innerHTML = `
        <img src="${item.image}" alt="${item.name}" loading="lazy" />
        <div class="item-name" style="color:var(--rarity-gold)">${item.name}</div>
        <div class="item-rarity-bar" style="background:${r.color}"></div>
      `;
      rareEl.appendChild(d);
    });
  } else {
    rareTitleEl.style.display = 'none';
  }

  updateOpenCost();
  document.getElementById('case-modal').classList.add('open');
}

function closeModal() {
  document.getElementById('case-modal').classList.remove('open');
}
document.getElementById('case-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('case-modal')) closeModal();
});

function setCount(n, btn) {
  openQty = n;
  document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  updateOpenCost();
}

function updateOpenCost() {
  const price = getCasePrice(currentCase);
  document.getElementById('open-cost').textContent = `花费: ${fmt(price * openQty)}`;
  document.getElementById('open-btn').textContent = `🔑 开箱 ×${openQty}`;
}

// ══════════════════════════════════════════════════════════
//  Opening Logic
// ══════════════════════════════════════════════════════════
function rollItem(c) {
  const pool = [...(c.contains || [])];
  const rare = [...(c.contains_rare || [])];

  // Build weighted pool
  // Simple rarity-based weighting
  const allItems = [];
  pool.forEach(item => {
    const r = RARITY_MAP[item.rarity?.id] || { key: 'milspec' };
    const w = Math.max(1, RARITY_WEIGHTS[r.key] || 10);
    for (let i = 0; i < Math.round(w); i++) allItems.push({ ...item, isRare: false });
  });
  // Rare items (knives/gloves) at ~0.26% combined
  if (rare.length > 0) {
    const rareW = Math.round(allItems.length * 0.0026);
    for (let i = 0; i < Math.max(1, rareW); i++) {
      const ri = rare[Math.floor(Math.random() * rare.length)];
      allItems.push({ ...ri, isRare: true });
    }
  }

  const chosen = allItems[Math.floor(Math.random() * allItems.length)];
  const wearIdx = Math.floor(Math.random() * 5);
  const floatVal = (Math.random() * 0.9 + 0.01).toFixed(6);
  const wear = WEAR_NAMES[wearIdx];
  const rarityInfo = RARITY_MAP[chosen.rarity?.id] || { color: '#b0c3d9', label: 'Consumer Grade', key: 'consumer' };
  const price = mockPrice(rarityInfo.key, wear);

  return { ...chosen, wear, floatVal, rarityInfo, price };
}

function openCase() {
  const price = getCasePrice(currentCase) * openQty;
  if (balance < price) {
    showToast('余额不足！请充值', 'error');
    return;
  }

  balance -= price;
  openCount += openQty;
  save();
  updateBalance();
  closeModal();

  if (openQty === 1) {
    doSingleSpin();
  } else {
    doMultiOpen();
  }
}

// ── Single spin animation ──
function doSingleSpin() {
  const result = rollItem(currentCase);
  lastOpened = result;

  // Build spin track items (60 items, last one is the winner)
  const track = document.getElementById('spin-track');
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  track.innerHTML = '';

  const items = [];
  for (let i = 0; i < 58; i++) {
    items.push(rollItem(currentCase));
  }
  items.push(result); // position 58 (0-indexed), center target

  const ITEM_W = 148; // 140 + 8 gap
  items.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'spin-item';
    div.style.borderColor = item.rarityInfo.color;
    div.innerHTML = `<img src="${item.image}" loading="lazy" onerror="this.src=''" /><div class="spin-name">${item.name}</div>`;
    track.appendChild(div);
  });

  // Show overlay, reset result
  document.getElementById('spin-result').classList.remove('show');
  document.getElementById('spin-overlay').classList.add('open');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      // Scroll so item 58 is centered
      // track starts with padding: 0 50%, so each item is offset from left edge
      // Center of track display: 0 (because padding-left is 50%)
      // We want item 58's center at x=0
      const targetOffset = 58 * ITEM_W + ITEM_W / 2;
      // Add slight random jitter within item
      const jitter = (Math.random() - 0.5) * 60;
      track.style.transition = 'transform 4s cubic-bezier(0.16, 1, 0.3, 1)';
      track.style.transform = `translateX(calc(-${targetOffset}px + ${jitter}px))`;

      setTimeout(() => showSingleResult(result), 4200);
    });
  });
}

function showSingleResult(item) {
  document.getElementById('result-img').src = item.image;
  document.getElementById('result-name').textContent = item.name;
  document.getElementById('result-rarity').textContent = item.rarityInfo.label;
  document.getElementById('result-rarity').style.color = item.rarityInfo.color;
  document.getElementById('result-wear').textContent = item.wear;
  document.getElementById('result-float').textContent = `Float: ${item.floatVal}`;

  const card = document.getElementById('result-card');
  card.style.borderColor = item.rarityInfo.color;
  card.style.color = item.rarityInfo.color;

  // Glow
  card.className = 'result-card';
  const key = item.rarityInfo.key;
  if (key === 'covert' || key === 'contraband') card.classList.add('glow-covert');
  else if (key === 'classified') card.classList.add('glow-classified');
  else if (key === 'restricted') card.classList.add('glow-restricted');
  else if (key === 'milspec') card.classList.add('glow-milspec');

  document.getElementById('btn-sell').textContent = `💰 卖出 ${fmt(item.price)}`;

  addToInventory(item);
  addToHistory(item, currentCase);

  document.getElementById('spin-result').classList.add('show');
}

// ── Multi open ──
function doMultiOpen() {
  const results = [];
  for (let i = 0; i < openQty; i++) results.push(rollItem(currentCase));
  lastOpenedMulti = results;
  results.forEach(r => { addToInventory(r); addToHistory(r, currentCase); });
  save();

  const grid = document.getElementById('multi-grid');
  grid.innerHTML = '';
  results.forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'multi-item';
    div.style.borderColor = item.rarityInfo.color;
    div.style.animationDelay = (idx * 80) + 'ms';
    div.innerHTML = `
      <img src="${item.image}" loading="lazy" />
      <div class="m-name">${item.name}</div>
      <div class="m-wear">${item.wear}</div>
    `;
    grid.appendChild(div);
  });

  const total = results.reduce((s, r) => s + r.price, 0);
  document.getElementById('multi-total').textContent = `总价值: ${fmt(total)}`;

  document.getElementById('spin-result').classList.remove('show');
  document.getElementById('multi-results').style.display = 'block';
  document.getElementById('spin-overlay').classList.add('open');
  // hide track wrap
  document.querySelector('.spin-track-wrap').style.display = 'none';
}

function sellResult() {
  if (!lastOpened) return;
  balance += lastOpened.price;
  // Remove last from inventory
  const idx = inventory.findIndex(i => i._uid === lastOpened._uid);
  if (idx !== -1) inventory.splice(idx, 1);
  save();
  updateBalance();
  showToast(`已卖出 ${lastOpened.name} — ${fmt(lastOpened.price)}`, 'success');
  closeSpin();
}

function sellAll() {
  if (!lastOpenedMulti) return;
  let total = 0;
  lastOpenedMulti.forEach(item => {
    total += item.price;
    const idx = inventory.findIndex(i => i._uid === item._uid);
    if (idx !== -1) inventory.splice(idx, 1);
  });
  balance += total;
  save();
  updateBalance();
  showToast(`已卖出全部 ${openQty} 件 — 共 ${fmt(total)}`, 'success');
  closeSpin();
}

function openAgain() {
  closeSpin();
  openCaseModal(currentCase);
}

function closeSpin() {
  document.getElementById('spin-overlay').classList.remove('open');
  document.getElementById('spin-result').classList.remove('show');
  document.getElementById('multi-results').style.display = 'none';
  document.querySelector('.spin-track-wrap').style.display = '';
  lastOpened = null;
  lastOpenedMulti = null;
}

// ══════════════════════════════════════════════════════════
//  Inventory
// ══════════════════════════════════════════════════════════
function addToInventory(item) {
  item._uid = Date.now() + Math.random().toString(36).slice(2);
  inventory.unshift(item);
  save();
}

function renderInventory() {
  const grid = document.getElementById('inv-grid');
  let filtered = [...inventory];
  if (invFilter !== 'all') filtered = filtered.filter(i => i.rarityInfo?.key === invFilter);

  // Stats
  document.getElementById('inv-count').textContent = inventory.length;
  const total = inventory.reduce((s, i) => s + (i.price || 0), 0);
  document.getElementById('inv-value').textContent = fmt(total);
  document.getElementById('inv-opens').textContent = openCount;
  const best = inventory.reduce((b, i) => i.price > (b?.price || 0) ? i : b, null);
  document.getElementById('inv-best').textContent = best ? fmt(best.price) : '—';

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2zM16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
      <p>${invFilter !== 'all' ? '没有该稀有度的物品' : '背包还是空的，去开箱吧！'}</p>
    </div>`;
    return;
  }

  grid.innerHTML = '';
  filtered.forEach(item => {
    const div = document.createElement('div');
    div.className = 'inv-item';
    div.style.borderColor = item.rarityInfo?.color || '#444';
    div.innerHTML = `
      <button class="inv-sell-btn" onclick="sellInvItem('${item._uid}',event)">卖 ${fmt(item.price)}</button>
      <img src="${item.image}" loading="lazy" onerror="this.src=''" />
      <div class="i-name">${item.name}</div>
      <div class="i-wear">${item.wear || ''}</div>
      <div class="i-float">${item.floatVal ? 'Float: ' + item.floatVal : ''}</div>
    `;
    grid.appendChild(div);
  });
}

function sellInvItem(uid, e) {
  e.stopPropagation();
  const idx = inventory.findIndex(i => i._uid === uid);
  if (idx === -1) return;
  const item = inventory[idx];
  balance += item.price;
  inventory.splice(idx, 1);
  save();
  updateBalance();
  showToast(`已卖出 — ${fmt(item.price)}`, 'success');
  renderInventory();
}

let invFilter2 = 'all';
function setInvFilter(f, btn) {
  invFilter = f;
  document.querySelectorAll('#page-inventory .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderInventory();
}

// ══════════════════════════════════════════════════════════
//  History
// ══════════════════════════════════════════════════════════
function addToHistory(item, caseObj) {
  history.unshift({
    name:     item.name,
    image:    item.image,
    wear:     item.wear,
    rarity:   item.rarityInfo,
    price:    item.price,
    caseName: caseObj?.name || '',
    time:     Date.now(),
  });
  if (history.length > 200) history.pop();
  save();
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (history.length === 0) {
    list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p>暂无记录</p></div>`;
    return;
  }
  list.innerHTML = '';
  history.slice(0, 100).forEach(h => {
    const timeAgo = timeSince(h.time);
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div class="history-item-rarity" style="background:${h.rarity?.color || '#888'}"></div>
      <img src="${h.image}" onerror="this.src=''" />
      <div class="history-item-info">
        <div class="history-item-name">${h.name}</div>
        <div class="history-item-meta">${h.caseName} · ${h.wear || ''}</div>
      </div>
      <div class="history-item-price">${fmt(h.price)}</div>
      <div class="history-time">${timeAgo}</div>
    `;
    list.appendChild(div);
  });
}

function timeSince(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}

// ══════════════════════════════════════════════════════════
//  Skins Page
// ══════════════════════════════════════════════════════════
let skinsRendered = 0;
const SKINS_PER_LOAD = 120;
let filteredSkins = [];

function renderSkinsPage(skins) {
  filteredSkins = skins;
  skinsRendered = 0;
  const cont = document.getElementById('skins-container');
  cont.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'inv-grid';
  grid.id = 'skins-grid';
  cont.appendChild(grid);
  loadMoreSkins();

  // Infinite scroll
  const observer = new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) loadMoreSkins();
  }, { rootMargin: '200px' });
  const sentinel = document.createElement('div');
  sentinel.id = 'skins-sentinel';
  cont.appendChild(sentinel);
  observer.observe(sentinel);
}

function loadMoreSkins() {
  const grid = document.getElementById('skins-grid');
  if (!grid) return;
  const chunk = filteredSkins.slice(skinsRendered, skinsRendered + SKINS_PER_LOAD);
  chunk.forEach(skin => {
    const r = RARITY_MAP[skin.rarity?.id] || { color: '#888', label: '', key: 'consumer' };
    const div = document.createElement('div');
    div.className = 'inv-item';
    div.style.borderColor = r.color;
    div.innerHTML = `
      <img src="${skin.image}" loading="lazy" onerror="this.src=''" />
      <div class="i-name">${skin.name}</div>
      <div class="i-wear" style="color:${r.color}">${r.label}</div>
    `;
    grid.appendChild(div);
  });
  skinsRendered += chunk.length;
}

function filterSkins() {
  const q = document.getElementById('skin-search').value.toLowerCase();
  filteredSkins = allSkins.filter(s => {
    const matchQ = s.name.toLowerCase().includes(q);
    const rKey = (RARITY_MAP[s.rarity?.id] || {}).key || '';
    const matchR = rarityFilter === 'all' || rKey === rarityFilter;
    return matchQ && matchR;
  });
  skinsRendered = 0;
  const grid = document.getElementById('skins-grid');
  if (grid) grid.innerHTML = '';
  loadMoreSkins();
}

function setRarityFilter(f, btn) {
  rarityFilter = f;
  document.querySelectorAll('#rarity-filters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterSkins();
}

// ══════════════════════════════════════════════════════════
//  Init
// ══════════════════════════════════════════════════════════
updateBalance();
loadData();
</script>
