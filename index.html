<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CS2 VAULT — 模拟开箱</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0c10;--s1:#13141a;--s2:#1a1c25;
  --border:#2c2f40;--accent:#e8a838;
  --txt:#dde1f0;--muted:#6b7090;--danger:#e85555;--ok:#43e87a;
}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* HEADER */
header{position:sticky;top:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:60px;background:rgba(11,12,16,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:900;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
.hdr-r{display:flex;align-items:center;gap:11px}
.bal-box{display:flex;align-items:center;gap:7px;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:5px 13px}
.bal-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bal-val{font-size:16px;font-weight:800;color:var(--accent)}
.btn-topup{cursor:pointer;background:linear-gradient(135deg,#e8a838,#ffd166);color:#1a1000;font-size:12px;font-weight:800;border:none;border-radius:6px;padding:7px 13px;transition:filter .2s,transform .15s}
.btn-topup:hover{filter:brightness(1.1);transform:translateY(-1px)}

/* NAV */
nav{display:flex;gap:2px;padding:0 22px;background:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto}
.nt{padding:12px 16px;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s;text-transform:uppercase;letter-spacing:.04em}
.nt:hover{color:var(--txt)}.nt.on{color:var(--accent);border-bottom-color:var(--accent)}

/* PAGES */
.page{display:none;padding:22px}.page.on{display:block}

/* PRICE LOADING STATUS */
#pbar{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;margin-bottom:16px;font-size:12px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.pdot.spin{background:var(--accent);animation:blink 1s infinite}
.pdot.ok{background:var(--ok)}.pdot.err{background:var(--danger)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.pbar-right{margin-left:auto;font-size:11px;color:var(--muted)}

/* SEC TITLE */
.st{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px;display:flex;align-items:center;gap:9px}
.st::after{content:'';flex:1;height:1px;background:var(--border)}

/* ODDS TABLE */
.odds-table{background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:18px;display:flex;gap:6px;flex-wrap:wrap}
.odds-item{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;background:var(--s1);font-size:11px;font-weight:700}
.odds-dot{width:8px;height:8px;border-radius:50%}
.odds-pct{font-size:13px;font-weight:800}

/* SEARCH/FILTER */
.bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.si{flex:1;min-width:160px;background:var(--s2);border:1px solid var(--border);color:var(--txt);padding:8px 13px;border-radius:8px;font-size:13px;outline:none;transition:border-color .2s}
.si:focus{border-color:var(--accent)}.si::placeholder{color:var(--muted)}
.chip{padding:4px 11px;background:var(--s2);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.chip:hover,.chip.on{background:rgba(232,168,56,.12);border-color:var(--accent);color:var(--accent)}

/* CASES GRID */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.cc{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:14px 12px 12px;cursor:pointer;text-align:center;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.cc:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 8px 24px rgba(232,168,56,.12)}
.cc-badge{position:absolute;top:7px;right:7px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;text-transform:uppercase;background:rgba(232,168,56,.15);color:var(--accent)}
.cc img{width:108px;height:81px;object-fit:contain;display:block;margin:0 auto 10px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.55));transition:transform .2s}
.cc:hover img{transform:scale(1.06)}
.cc-name{font-size:11px;font-weight:700;line-height:1.35;margin-bottom:7px}
.cc-price{font-size:14px;font-weight:800;color:var(--accent)}
.cc-price.loading-p{color:var(--muted);font-size:11px}
.cc-ev{font-size:10px;margin-top:3px}
.cc-ev.pos{color:var(--ok)}.cc-ev.neg{color:var(--danger)}

/* LOADING */
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;gap:12px;color:var(--muted)}
.sp{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.ov.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:16px;width:92vw;max-width:840px;max-height:92vh;overflow-y:auto;padding:24px;position:relative}
.mx{position:absolute;top:12px;right:13px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;transition:color .2s}
.mx:hover{color:var(--danger)}
.mt{display:flex;gap:18px;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap}
.mc-img{width:115px;height:87px;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(0,0,0,.6));flex-shrink:0}
.mi-title{font-size:18px;font-weight:900;color:var(--accent);margin-bottom:4px}
.mi-sub{font-size:12px;color:var(--muted);line-height:1.8}
.mi-sub span{color:var(--txt);font-weight:700}

/* ODDS DISPLAY IN MODAL */
.odds-row{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}
.odd-tag{display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700;border:1px solid}

/* CONTAINS */
.sub-t{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:8px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-bottom:14px}
.it{background:var(--s2);border-radius:7px;padding:7px 5px;text-align:center;border:1px solid var(--border)}
.it img{width:60px;height:45px;object-fit:contain;display:block;margin:0 auto 4px}
.it .tn{font-size:9px;line-height:1.3;color:var(--txt)}
.it .tp{font-size:9px;margin-top:3px;font-weight:600}
.it .tb{height:2px;border-radius:2px;margin-top:4px}

/* OPEN CONTROLS */
.or{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.qb{display:flex;gap:4px}
.qbtn{padding:7px 11px;background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--txt);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.qbtn.on,.qbtn:hover{background:rgba(232,168,56,.12);border-color:var(--accent);color:var(--accent)}
.btn-open{flex:1;min-width:130px;padding:10px 18px;background:linear-gradient(135deg,#e8a838,#ffd166);color:#1a1000;font-size:14px;font-weight:900;border:none;border-radius:8px;cursor:pointer;text-transform:uppercase;transition:filter .2s,transform .15s}
.btn-open:hover{filter:brightness(1.1);transform:translateY(-1px)}
.ct{font-size:11px;color:var(--muted)}

/* SPIN */
.sov{display:none;position:fixed;inset:0;background:rgba(7,8,12,.96);z-index:300;flex-direction:column;align-items:center;justify-content:center}
.sov.on{display:flex}
.slbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:22px}
.tw{width:100%;max-width:800px;overflow:hidden;padding:0 20px;position:relative}
.tw::before,.tw::after{content:'';position:absolute;top:0;bottom:0;width:110px;z-index:2;pointer-events:none}
.tw::before{left:20px;background:linear-gradient(to right,rgba(7,8,12,.95),transparent)}
.tw::after{right:20px;background:linear-gradient(to left,rgba(7,8,12,.95),transparent)}
.ptr{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:3px;background:var(--accent);z-index:5;box-shadow:0 0 16px var(--accent)}
.ptr::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-top-color:var(--accent)}
.ptr::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-bottom-color:var(--accent)}
.track{display:flex;gap:8px;will-change:transform;padding:0 50%}
.sc{flex-shrink:0;width:128px;background:var(--s1);border:2px solid var(--border);border-radius:9px;padding:10px 7px;text-align:center}
.sc img{width:88px;height:66px;object-fit:contain;display:block;margin:0 auto 5px}
.sc .sn{font-size:9px;font-weight:700;line-height:1.3}

/* RESULT */
.rp{display:none;flex-direction:column;align-items:center;gap:14px;margin-top:28px;text-align:center}
.rp.on{display:flex}
.rc{background:var(--s1);border:2px solid;border-radius:14px;padding:26px 38px;position:relative;overflow:hidden}
.rc::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,currentColor,transparent 65%);opacity:.07}
.rc img{width:170px;height:128px;object-fit:contain;display:block;margin:0 auto 13px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}
.rn{font-size:18px;font-weight:900}
.rr{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.rw{font-size:12px;color:var(--muted);margin-top:4px}
.rf{font-size:10px;color:var(--muted);margin-top:2px}
.rprice{font-size:20px;font-weight:900;color:var(--ok);margin-top:8px}
.rprice-sub{font-size:10px;color:var(--muted);margin-top:2px}
.ra{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bsell{padding:9px 18px;background:rgba(67,232,122,.1);border:1px solid var(--ok);color:var(--ok);font-size:13px;font-weight:800;border-radius:7px;cursor:pointer;transition:background .2s}
.bsell:hover{background:rgba(67,232,122,.22)}
.bagain{padding:9px 18px;background:linear-gradient(135deg,#e8a838,#ffd166);color:#1a1000;font-size:13px;font-weight:900;border:none;border-radius:7px;cursor:pointer;transition:filter .2s}
.bagain:hover{filter:brightness(1.1)}
.bclose{padding:9px 14px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:13px;border-radius:7px;cursor:pointer;transition:all .2s}
.bclose:hover{color:var(--txt);border-color:var(--txt)}

/* MULTI */
.mp{display:none;flex-direction:column;align-items:center;gap:13px;width:92%;max-width:860px;margin-top:22px}
.mp.on{display:flex}
.mhdr{font-size:15px;font-weight:900;color:var(--accent)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;width:100%}
.mcard{background:var(--s1);border:2px solid;border-radius:9px;padding:9px 7px;text-align:center;animation:fu .3s ease both}
@keyframes fu{from{opacity:0;transform:translateY(7px)}to{opacity:1}}
.mcard img{width:74px;height:56px;object-fit:contain;display:block;margin:0 auto 5px}
.mc-n{font-size:9px;font-weight:700;line-height:1.3}
.mc-w{font-size:8px;color:var(--muted);margin-top:1px}
.mc-p{font-size:10px;font-weight:800;color:var(--ok);margin-top:2px}
.mtotal{font-size:13px;color:var(--muted)}.mtotal span{color:var(--ok);font-weight:800}

/* INVENTORY */
.srow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.sb{background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:12px 16px;min-width:120px}
.sl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sv{font-size:20px;font-weight:900;color:var(--accent);margin-top:3px}
.ig2{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.icard{background:var(--s1);border:2px solid;border-radius:9px;padding:9px 7px;text-align:center;position:relative;transition:transform .15s,box-shadow .15s}
.icard:hover{transform:translateY(-3px);box-shadow:0 5px 18px rgba(0,0,0,.4)}
.icard img{width:74px;height:56px;object-fit:contain;display:block;margin:0 auto 5px}
.ic-n{font-size:9px;font-weight:700;line-height:1.3}
.ic-w{font-size:8px;color:var(--muted);margin-top:1px}
.ic-p{font-size:10px;font-weight:800;color:var(--ok);margin-top:2px}
.ic-sell{position:absolute;top:4px;right:4px;background:rgba(67,232,122,.14);border:none;border-radius:4px;color:var(--ok);font-size:9px;font-weight:800;padding:2px 5px;cursor:pointer;display:none}
.icard:hover .ic-sell{display:block}
.ic-sell:hover{background:rgba(67,232,122,.3)}
.empty{text-align:center;padding:55px 20px;color:var(--muted);grid-column:1/-1}

/* HISTORY */
.hl{display:flex;flex-direction:column;gap:8px}
.hi{display:flex;align-items:center;gap:12px;background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:10px 13px;animation:sl .3s ease}
@keyframes sl{from{opacity:0;transform:translateX(-8px)}to{opacity:1}}
.hbar{width:3px;align-self:stretch;border-radius:4px;flex-shrink:0}
.himg{width:56px;height:42px;object-fit:contain;flex-shrink:0}
.hinfo{flex:1}
.hname{font-size:12px;font-weight:800}
.hmeta{font-size:10px;color:var(--muted);margin-top:2px}
.hprice{font-size:14px;font-weight:800;color:var(--ok);text-align:right}
.hprice-sub{font-size:9px;color:var(--muted)}
.htime{font-size:9px;color:var(--muted);flex-shrink:0}

/* SKINS */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.skcard{background:var(--s1);border:2px solid;border-radius:9px;padding:9px 7px;text-align:center;transition:transform .15s,box-shadow .15s;cursor:default}
.skcard:hover{transform:translateY(-3px);box-shadow:0 5px 18px rgba(0,0,0,.4)}
.skcard img{width:74px;height:56px;object-fit:contain;display:block;margin:0 auto 5px}
.sk-n{font-size:9px;font-weight:700;line-height:1.3}
.sk-r{font-size:8px;margin-top:2px;font-weight:600}
.sk-p{font-size:10px;font-weight:800;color:var(--ok);margin-top:3px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;background:var(--s2);border:1px solid var(--border);padding:11px 15px;border-radius:9px;font-size:12px;z-index:999;transform:translateY(80px);opacity:0;transition:transform .3s,opacity .3s;max-width:260px;line-height:1.4}
.toast.on{transform:translateY(0);opacity:1}
.toast.ok{border-color:var(--ok);color:var(--ok)}.toast.err{border-color:var(--danger);color:var(--danger)}

/* KNIFE FLASH */
@keyframes knifeGlow{0%,100%{box-shadow:0 0 20px rgba(235,75,75,.4)}50%{box-shadow:0 0 50px rgba(235,75,75,.9),0 0 100px rgba(235,75,75,.4)}}
.knife-flash{animation:knifeGlow 1s ease infinite}

@media(max-width:560px){
  header{padding:0 11px}.logo{font-size:14px}
  nav{padding:0 5px}.nt{padding:10px 9px;font-size:11px}
  .page{padding:13px}.rc{padding:18px 12px}
  .sc{width:108px}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
      <polygon points="20,3 37,12 37,28 20,37 3,28 3,12" fill="rgba(232,168,56,.12)" stroke="#e8a838" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="6" fill="#e8a838"/><circle cx="20" cy="20" r="3" fill="#1a1000"/>
    </svg>
    CS2 VAULT
  </div>
  <div class="hdr-r">
    <div class="bal-box">
      <span class="bal-lbl">余额</span>
      <span class="bal-val" id="bal">$1,000.00</span>
    </div>
    <button class="btn-topup" onclick="topUp()">+ 充值</button>
  </div>
</header>

<nav>
  <div class="nt on" onclick="goPage('cases',this)">🎁 武器箱</div>
  <div class="nt" onclick="goPage('skins',this)">🔫 皮肤库</div>
  <div class="nt" onclick="goPage('inv',this)">🎒 背包</div>
  <div class="nt" onclick="goPage('hist',this)">📜 记录</div>
</nav>

<!-- CASES PAGE -->
<div class="page on" id="page-cases">
  <div id="pbar">
    <div class="pdot spin" id="pdot"></div>
    <span id="ptxt">正在加载皮肤数据…</span>
    <span class="pbar-right" id="pright"></span>
  </div>

  <!-- 官方爆率说明 -->
  <div class="odds-table">
    <div style="font-size:11px;font-weight:800;color:var(--muted);width:100%;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em">⚡ Valve 官方爆率</div>
    <div class="odds-item"><div class="odds-dot" style="background:#4b69ff"></div><span>Mil-Spec</span><span class="odds-pct" style="color:#4b69ff">79.92%</span></div>
    <div class="odds-item"><div class="odds-dot" style="background:#8847ff"></div><span>Restricted</span><span class="odds-pct" style="color:#8847ff">15.98%</span></div>
    <div class="odds-item"><div class="odds-dot" style="background:#d32ce6"></div><span>Classified</span><span class="odds-pct" style="color:#d32ce6">3.20%</span></div>
    <div class="odds-item"><div class="odds-dot" style="background:#eb4b4b"></div><span>Covert</span><span class="odds-pct" style="color:#eb4b4b">0.64%</span></div>
    <div class="odds-item"><div class="odds-dot" style="background:#e4ae39"></div><span>★ 刀/手套</span><span class="odds-pct" style="color:#e4ae39">0.26%</span></div>
    <div class="odds-item"><div class="odds-dot" style="background:#aaa"></div><span>StatTrak™</span><span class="odds-pct" style="color:#aaa">×10%</span></div>
  </div>

  <div class="st">选择武器箱</div>
  <div class="bar">
    <input class="si" id="cq" placeholder="🔍 搜索武器箱…" oninput="filterCases()"/>
    <div id="tc" style="display:flex;gap:5px;flex-wrap:wrap"></div>
  </div>
  <div id="cw"><div class="ld"><div class="sp"></div><span>连接数据源…</span></div></div>
</div>

<!-- SKINS PAGE -->
<div class="page" id="page-skins">
  <div class="st">全部皮肤</div>
  <div class="bar">
    <input class="si" id="sq" placeholder="🔍 搜索皮肤…" oninput="filterSkins()"/>
    <div id="rc2" style="display:flex;gap:5px;flex-wrap:wrap"></div>
  </div>
  <div id="sw"><div class="ld"><div class="sp"></div><span>加载皮肤库…</span></div></div>
</div>

<!-- INVENTORY PAGE -->
<div class="page" id="page-inv">
  <div class="st">我的背包</div>
  <div class="srow">
    <div class="sb"><div class="sl">物品数</div><div class="sv" id="sc">0</div></div>
    <div class="sb"><div class="sl">总价值</div><div class="sv" id="sv">$0</div></div>
    <div class="sb"><div class="sl">开箱次数</div><div class="sv" id="so">0</div></div>
    <div class="sb"><div class="sl">最贵物品</div><div class="sv" id="sbest">—</div></div>
  </div>
  <div class="bar"><div id="ic" style="display:flex;gap:5px;flex-wrap:wrap"></div></div>
  <div class="ig2" id="ig"></div>
</div>

<!-- HISTORY PAGE -->
<div class="page" id="page-hist">
  <div class="st">开箱记录</div>
  <div class="hl" id="hl"></div>
</div>

<!-- CASE MODAL -->
<div class="ov" id="cmo">
  <div class="modal">
    <button class="mx" onclick="closeModal()">✕</button>
    <div class="mt">
      <img id="mci" src="" class="mc-img"/>
      <div>
        <div class="mi-title" id="mct"></div>
        <div class="mi-sub" id="mcs"></div>
        <div class="odds-row" id="modal-odds"></div>
      </div>
    </div>

<script>
// ══════════════════════════════════════════════
//  官方爆率（Valve 2018年公开的数据，从未改变）
// ══════════════════════════════════════════════
const OFFICIAL_RATES = {
  // 普通武器箱
  case: {
    milspec:    0.7992,
    restricted: 0.1598,
    classified: 0.0320,
    covert:     0.0064,
    gold:       0.0026,   // 刀/手套
  },
  // Souvenir 包（5倍稀有）
  souvenir: {
    consumer:   0.800,
    industrial: 0.160,
    milspec:    0.032,
    restricted: 0.0064,
    classified: 0.00128,
    covert:     0.000256,
  },
  // StatTrak™ 概率（独立于稀有度，10%）
  stattrak: 0.10,
};

// ══════════════════════════════════════════════
//  磨损概率分布（Valve 官方 float 权重）
// ══════════════════════════════════════════════
const WEAR_DIST = [
  { name: 'Factory New',    weight: 0.03, floatMin: 0.00, floatMax: 0.07 },
  { name: 'Minimal Wear',   weight: 0.24, floatMin: 0.07, floatMax: 0.15 },
  { name: 'Field-Tested',   weight: 0.33, floatMin: 0.15, floatMax: 0.38 },
  { name: 'Well-Worn',      weight: 0.24, floatMin: 0.38, floatMax: 0.45 },
  { name: 'Battle-Scarred', weight: 0.16, floatMin: 0.45, floatMax: 1.00 },
];

// 磨损倍率（越新越贵）
const WEAR_MULT = { 'Factory New': 2.5, 'Minimal Wear': 1.4, 'Field-Tested': 1.0, 'Well-Worn': 0.65, 'Battle-Scarred': 0.4 };

// ══════════════════════════════════════════════
//  真实箱子价格（Steam Market 参考价，美元）
//  来源：steamdb.info / csgobackpack 等，2024年数据
// ══════════════════════════════════════════════
const CASE_PRICES = {
  // 活跃箱子（需钥匙，约 $2.49）
  'CS:GO Weapon Case':                 0.08,
  'CS:GO Weapon Case 2':               0.08,
  'CS:GO Weapon Case 3':               0.08,
  'Operation Bravo Case':              54.90,
  'CS:GO Operation Breakout Weapon Case': 4.20,
  'eSports 2013 Case':                 2.50,
  'eSports 2013 Winter Case':          1.80,
  'eSports 2014 Summer Case':          1.60,
  'Operation Phoenix Weapon Case':     0.30,
  'Huntsman Weapon Case':              0.50,
  'Operation Vanguard Weapon Case':    4.93,
  'Chroma Case':                       4.29,
  'Chroma 2 Case':                     3.36,
  'Chroma 3 Case':                     0.50,
  'Falchion Case':                     1.56,
  'Shadow Case':                       1.58,
  'Revolver Case':                     0.30,
  'Operation Wildfire Case':           0.80,
  'Gamma Case':                        2.77,
  'Gamma 2 Case':                      2.70,
  'Glove Case':                        3.20,
  'Spectrum Case':                     3.32,
  'Spectrum 2 Case':                   2.55,
  'Operation Hydra Case':              28.02,
  'Clutch Case':                       0.51,
  'Horizon Case':                      1.40,
  'Danger Zone Case':                  1.12,
  'Prisma Case':                       1.23,
  'CS20 Case':                         0.91,
  'Shattered Web Case':                4.40,
  'Fracture Case':                     0.41,
  'Prisma 2 Case':                     1.20,
  'Operation Broken Fang Case':        1.90,
  'Snakebite Case':                    0.50,
  'Dreams & Nightmares Case':          0.80,
  'Operation Riptide Case':            0.60,
  'Recoil Case':                       0.55,
  'Revolution Case':                   0.65,
  'Kilowatt Case':                     0.58,
  'Gallery Case':                      0.70,
  'Fever Case':                        0.75,
  // 纪念品包
  'Anubis Collection Package':         1.69,
};
const KEY_PRICE = 2.49; // Steam 钥匙价格

// ══════════════════════════════════════════════
//  皮肤价格参考基准（按稀有度+磨损，基于Steam市场统计）
//  Field-Tested 为基准价格
// ══════════════════════════════════════════════
const SKIN_BASE_PRICE = {
  consumer:   { min: 0.03, max: 0.15  },
  industrial: { min: 0.05, max: 0.50  },
  milspec:    { min: 0.15, max: 5.00  },
  restricted: { min: 0.80, max: 30.0  },
  classified: { min: 5.00, max: 200.0 },
  covert:     { min: 30.0, max: 800.0 },
  gold:       { min: 80.0, max: 5000.0}, // 刀/手套
};

// ══════════════════════════════════════════════
//  稀有度映射
// ══════════════════════════════════════════════
const RARITY = {
  rarity_consumer_weapon:  {l:'Consumer Grade', c:'#b0c3d9',k:'consumer'},
  rarity_common:           {l:'Consumer Grade', c:'#b0c3d9',k:'consumer'},
  rarity_uncommon_weapon:  {l:'Industrial Grade',c:'#5e98d9',k:'industrial'},
  rarity_rare_weapon:      {l:'Mil-Spec Grade', c:'#4b69ff',k:'milspec'},
  rarity_mythical_weapon:  {l:'Restricted',     c:'#8847ff',k:'restricted'},
  rarity_legendary_weapon: {l:'Classified',     c:'#d32ce6',k:'classified'},
  rarity_ancient_weapon:   {l:'Covert',         c:'#eb4b4b',k:'covert'},
  rarity_ancient:          {l:'Covert',         c:'#eb4b4b',k:'covert'},
  rarity_contraband:       {l:'Contraband',     c:'#e4ae39',k:'gold'},
};

// ══════════════════════════════════════════════
//  数据源（jsDelivr 多节点）
// ══════════════════════════════════════════════
const SOURCES = [
  'https://cdn.jsdelivr.net/gh/ByMykel/CSGO-API@main/public/api/en',
  'https://fastly.jsdelivr.net/gh/ByMykel/CSGO-API@main/public/api/en',
  'https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en',
];
const IMG_FB = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="88" height="66"><rect width="88" height="66" fill="%231a1c25" rx="4"/><text x="44" y="37" text-anchor="middle" fill="%236b7090" font-size="10" font-family="sans-serif">NO IMG</text></svg>';

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let bal   = +localStorage.getItem('v_bal') || 1000;
let inv   = JSON.parse(localStorage.getItem('v_inv')  || '[]');
let hist  = JSON.parse(localStorage.getItem('v_hist') || '[]');
let opens = +localStorage.getItem('v_opens') || 0;

let allCases=[], allSkins=[];
let curCase=null, qty=1;
let lastItem=null, lastMulti=null;
let cTypeF='all', rarF='all', invF='all';
let skOff=0, skFiltered=[];
const SK_PER=100;

// 动态皮肤价格缓存（skin name → FT price）
const priceCache = {};

// ══════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════
const $=id=>document.getElementById(id);
const fmt=n=>'$'+Math.abs(parseFloat(n)).toFixed(2);
const fmtS=n=>'¥'+Math.abs(parseFloat(n)*7.2).toFixed(0); // 人民币参考
function save(){
  localStorage.setItem('v_bal',bal.toFixed(2));
  localStorage.setItem('v_inv',JSON.stringify(inv));
  localStorage.setItem('v_hist',JSON.stringify(hist));
  localStorage.setItem('v_opens',opens);
}
function updateBal(){$('bal').textContent=fmt(bal)}
function toast(msg,type=''){
  const t=$('toast');t.textContent=msg;
  t.className='toast on'+(type?' '+type:'');
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',3000);
}
function topUp(){bal+=100;save();updateBal();toast('+$100.00 充值成功','ok')}
function goPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nt').forEach(n=>n.classList.remove('on'));
  $('page-'+id).classList.add('on');el.classList.add('on');
  if(id==='inv')renderInv();
  if(id==='hist')renderHist();
}
function rar(item){return RARITY[item?.rarity?.id]||{l:'',c:'#555',k:'consumer'}}

// ══════════════════════════════════════════════
//  价格计算（基于真实市场数据）
// ══════════════════════════════════════════════
function getSkinPrice(name, rarKey, wear) {
  // 优先从 priceCache 取动态价格
  const wearSuffix = wear ? ` (${wear})` : '';
  const key = name + wearSuffix;
  if (priceCache[key] !== undefined) return priceCache[key];

  // 否则基于稀有度范围做随机估价（模拟真实价格分布）
  const range = SKIN_BASE_PRICE[rarKey] || SKIN_BASE_PRICE.consumer;
  const mult = WEAR_MULT[wear] || 1;
  // 使用对数均匀分布（市场价格呈对数正态分布）
  const logMin = Math.log(range.min);
  const logMax = Math.log(range.max);
  const logPrice = logMin + Math.random() * (logMax - logMin);
  const basePrice = Math.exp(logPrice);
  return Math.round(basePrice * mult * 100) / 100;
}

function getCasePrice(c) {
  if (!c) return KEY_PRICE + 0.50;
  // 先查固定价格表
  const p = CASE_PRICES[c.name];
  if (p !== undefined) return p;
  // 否则按类型估算
  if (c.type === 'Souvenir') return 2.00;
  return 0.50; // 旧箱子默认便宜
}

function getCaseOpenCost(c) {
  // 开箱费 = 箱子价格 + 钥匙价格
  const caseP = getCasePrice(c);
  if (c.type === 'Souvenir') return caseP; // souvenir 不需要钥匙
  return caseP + KEY_PRICE;
}

// 期望价值（EV）计算
function calcEV(c) {
  const pool = c.contains || [];
  const rare = c.contains_rare || [];
  const rates = OFFICIAL_RATES.case;

  // 按稀有度分组
  const byRarity = {};
  pool.forEach(it => {
    const k = rar(it).k;
    if (!byRarity[k]) byRarity[k] = [];
    byRarity[k].push(it);
  });

  let ev = 0;
  const rarOrder = ['milspec','restricted','classified','covert'];
  rarOrder.forEach(k => {
    const items = byRarity[k] || [];
    if (!items.length) return;
    const rate = rates[k] || 0;
    // 每个稀有度内物品等概率
    items.forEach(it => {
      const itemRate = rate / items.length;
      // 按磨损分布计算期望
      WEAR_DIST.forEach(w => {
        const p = getSkinPrice(it.name, k, w.name);
        ev += itemRate * w.weight * p;
      });
    });
  });
  // 刀/手套期望
  if (rare.length > 0) {
    const goldRate = rates.gold || 0;
    rare.forEach(it => {
      const itemRate = goldRate / rare.length;
      WEAR_DIST.forEach(w => {
        const p = getSkinPrice(it.name, 'gold', w.name);
        ev += itemRate * w.weight * p;
      });
    });
  }
  return Math.round(ev * 100) / 100;
}

// ══════════════════════════════════════════════
//  磨损随机（按官方权重）
// ══════════════════════════════════════════════
function rollWear() {
  const r = Math.random();
  let cum = 0;
  for (const w of WEAR_DIST) {
    cum += w.weight;
    if (r <= cum) return w;
  }
  return WEAR_DIST[WEAR_DIST.length - 1];
}

// ══════════════════════════════════════════════
//  开箱主逻辑（严格按官方爆率）
// ══════════════════════════════════════════════
function roll(c) {
  const pool = [...(c.contains || [])];
  const rare = [...(c.contains_rare || [])];
  const isSouvenir = c.type === 'Souvenir';
  const rates = isSouvenir ? OFFICIAL_RATES.souvenir : OFFICIAL_RATES.case;

  // 按稀有度分组
  const byRarity = { consumer:[], industrial:[], milspec:[], restricted:[], classified:[], covert:[] };
  pool.forEach(it => {
    const k = rar(it).k;
    if (byRarity[k]) byRarity[k].push(it);
    else byRarity.milspec.push(it); // 兜底
  });

  // 投掷随机数决定稀有度
  const r = Math.random();
  let chosen = null, rarKey = 'milspec', isRare = false;

  if (!isSouvenir && rare.length > 0 && r < rates.gold) {
    // 刀/手套
    chosen = rare[Math.floor(Math.random() * rare.length)];
    rarKey = 'gold'; isRare = true;
  } else {
    // 计算累计概率（从高稀有度开始）
    const order = isSouvenir
      ? [['classified',rates.classified],['restricted',rates.restricted],['milspec',rates.milspec],['industrial',rates.industrial],['consumer',rates.consumer]]
      : [['covert',rates.covert],['classified',rates.classified],['restricted',rates.restricted],['milspec',rates.milspec]];

    let cum = isSouvenir ? 0 : rates.gold;
    for (const [k, rate] of order) {
      cum += rate;
      const pool2 = byRarity[k];
      if (r < cum && pool2 && pool2.length > 0) {
        chosen = pool2[Math.floor(Math.random() * pool2.length)];
        rarKey = k; break;
      }
    }
    // 兜底：取最低稀有度有货的
    if (!chosen) {
      const fallback = ['milspec','industrial','consumer','restricted','classified','covert'];
      for (const k of fallback) {
        if (byRarity[k]?.length) { chosen = byRarity[k][0]; rarKey = k; break; }
      }
    }
  }

  // StatTrak（10% 独立概率）
  const hasStatTrak = !isRare && !isSouvenir && Math.random() < OFFICIAL_RATES.stattrak && chosen?.name;
  const wear = rollWear();
  const floatVal = (wear.floatMin + Math.random() * (wear.floatMax - wear.floatMin)).toFixed(6);
  const r2 = rar(chosen);
  const skinKey = rarKey === 'gold' ? 'gold' : r2.k;
  const price = getSkinPrice((chosen?.name||''), skinKey, wear.name);
  const stPrice = hasStatTrak ? price * 1.8 : price; // StatTrak 约贵80%

  return {
    ...chosen,
    wear: wear.name, flt: floatVal,
    r: r2, rarKey: skinKey,
    isRare, isSouvenir,
    stattrak: hasStatTrak,
    p: Math.round(stPrice * 100) / 100,
    _uid: Date.now() + Math.random().toString(36).slice(2),
  };
}

// ══════════════════════════════════════════════
//  数据加载
// ══════════════════════════════════════════════
function setStatus(state, msg, sub='') {
  $('pdot').className = 'pdot ' + state;
  $('ptxt').textContent = msg;
  $('pright').textContent = sub;
}

async function fetchFallback(path) {
  for (let i = 0; i < SOURCES.length; i++) {
    try {
      setStatus('spin', `加载数据中，尝试数据源 ${i+1}/${SOURCES.length}…`);
      const r = await fetch(SOURCES[i]+path, {signal: AbortSignal.timeout(9000)});
      if (!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    } catch(e) { console.warn('Source', i+1, 'failed:', e.message); }
  }
  throw new Error('所有数据源均失败，请开代理后刷新重试');
}

async function load() {
  try {
    const [crates, skins] = await Promise.all([
      fetchFallback('/crates.json'),
      fetchFallback('/skins.json'),
    ]);
    allCases = crates.filter(c => c.contains?.length > 0 && ['Case','Souvenir','Capsule','Package'].includes(c.type));
    allSkins = skins;
    setStatus('ok', `加载完成 · ${allCases.length} 个箱子 · ${allSkins.length} 个皮肤`, '价格来源: Steam Market 参考');
    buildTypeChips(); buildRarChips(); buildInvChips();
    renderCases(allCases); initSkins(allSkins);
  } catch(e) {
    setStatus('err', '加载失败: ' + e.message);
    $('cw').innerHTML = `<div style="color:var(--danger);padding:50px;text-align:center;line-height:2.2">
      ⚠️ 数据加载失败<br><small>${e.message}</small><br><br>
      <b>国内用户：</b>请开启代理后刷新<br>
      <button onclick="load()" style="padding:8px 20px;background:var(--accent);color:#1a1000;font-weight:800;border:none;border-radius:6px;cursor:pointer;margin-top:10px">🔄 重试</button>
    </div>`;
  }
}

// ══════════════════════════════════════════════
//  CASES PAGE
// ══════════════════════════════════════════════
function buildTypeChips() {
  const types = ['全部','Case','Souvenir','Capsule'];
  const w = $('tc');
  types.forEach(t => {
    const b = document.createElement('button'); b.className = 'chip' + (t==='全部'?' on':'');
    b.textContent = t;
    b.onclick = () => { cTypeF = t==='全部'?'all':t; w.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filterCases(); };
    w.appendChild(b);
  });
}
function filterCases() {
  const q = $('cq').value.toLowerCase();
  renderCases(allCases.filter(c => c.name.toLowerCase().includes(q) && (cTypeF==='all' || c.type===cTypeF)));
}
function renderCases(list) {
  const w = $('cw');
  if (!list.length) { w.innerHTML = '<div style="color:var(--muted);padding:50px;text-align:center">无匹配结果</div>'; return; }
  const g = document.createElement('div'); g.className = 'cg';
  list.forEach(c => {
    const caseP = getCasePrice(c);
    const openCost = getCaseOpenCost(c);
    const ev = calcEV(c);
    const roi = ev - openCost;
    const roiPct = openCost > 0 ? ((roi / openCost) * 100).toFixed(1) : '0';
    const evSign = roi >= 0 ? '+' : '';

    const d = document.createElement('div'); d.className = 'cc';
    d.innerHTML = `
      ${c.type ? `<div class="cc-badge">${c.type}</div>` : ''}
      <img src="${c.image}" loading="lazy" onerror="this.src='${IMG_FB}'"/>
      <div class="cc-name">${c.name}</div>
      <div class="cc-price">${fmt(caseP)} <span style="font-size:10px;color:var(--muted)">+钥匙${fmt(KEY_PRICE)}</span></div>
      <div class="cc-ev ${roi>=0?'pos':'neg'}">${evSign}${fmt(roi)} ROI (${evSign}${roiPct}%)</div>`;
    d.onclick = () => openModal(c);
    g.appendChild(d);
  });
  w.innerHTML = ''; w.appendChild(g);
}

// ══════════════════════════════════════════════
//  MODAL
// ══════════════════════════════════════════════
function openModal(c) {
  curCase = c; qty = 1;
  document.querySelectorAll('.qbtn').forEach((b,i) => b.classList.toggle('on', i===0));
  $('mci').src = c.image;
  $('mct').textContent = c.name;

  const caseP = getCasePrice(c);
  const openCost = getCaseOpenCost(c);
  const ev = calcEV(c);
  const roi = ev - openCost;

  $('mcs').innerHTML = `
    类型 <span>${c.type||'—'}</span> &nbsp;·&nbsp; 首发 <span>${c.first_sale_date||'—'}</span><br>
    箱子价格 <span>${fmt(caseP)}</span> &nbsp;·&nbsp; 钥匙 <span>${c.type==='Souvenir'?'无需':''+fmt(KEY_PRICE)}</span> &nbsp;·&nbsp; 开箱总费用 <span>${fmt(openCost)}</span><br>
    期望价值 <span>${fmt(ev)}</span> &nbsp;·&nbsp; 期望收益 <span style="color:${roi>=0?'var(--ok)':'var(--danger)'}">
      ${roi>=0?'+':''}${fmt(roi)} (${roi>=0?'+':''}${((roi/openCost)*100).toFixed(1)}%)</span>`;

  // 爆率标签（根据类型选择）
  const isSouvenir = c.type === 'Souvenir';
  const oddData = isSouvenir ? [
    {c:'#b0c3d9',l:'Consumer',p:'80%'},{c:'#5e98d9',l:'Industrial',p:'16%'},
    {c:'#4b69ff',l:'Mil-Spec',p:'3.2%'},{c:'#8847ff',l:'Restricted',p:'0.64%'},
    {c:'#d32ce6',l:'Classified',p:'0.128%'},{c:'#eb4b4b',l:'Covert',p:'0.026%'},
  ] : [
    {c:'#4b69ff',l:'Mil-Spec',p:'79.92%'},{c:'#8847ff',l:'Restricted',p:'15.98%'},
    {c:'#d32ce6',l:'Classified',p:'3.20%'},{c:'#eb4b4b',l:'Covert',p:'0.64%'},
    {c:'#e4ae39',l:'★刀/手套',p:'0.26%'},
  ];
  $('modal-odds').innerHTML = oddData.map(o =>
    `<div class="odd-tag" style="border-color:${o.c}40;color:${o.c}">
      <div style="width:6px;height:6px;border-radius:50%;background:${o.c}"></div>${o.l}: ${o.p}
    </div>`
  ).join('');

  // 物品列表
  const ig = $('mit'); ig.innerHTML = '';
  (c.contains||[]).forEach(it => {
    const r = rar(it);
    const ftPrice = getSkinPrice(it.name, r.k, 'Field-Tested');
    const d = document.createElement('div'); d.className = 'it';
    d.innerHTML = `<img src="${it.image}" loading="lazy" onerror="this.src='${IMG_FB}'"/>
      <div class="tn">${it.name}</div>
      <div class="tp" style="color:${r.c}">${r.l}</div>
      <div class="tp" style="color:var(--ok)">${fmt(ftPrice)}</div>
      <div class="tb" style="background:${r.c}"></div>`;
    ig.appendChild(d);
  });
  $('items-count').textContent = `(${(c.contains||[]).length} 件)`;

  // 稀有物品
  const rg = $('mir'), rl = $('rlt'); rg.innerHTML = '';
  if (c.contains_rare?.length) {
    rl.style.display = '';
    rl.textContent = `★ 稀有特殊物品（${(c.contains_rare||[]).length} 把刀/手套，0.26%）`;
    c.contains_rare.forEach(it => {
      const avgP = getSkinPrice(it.name, 'gold', 'Field-Tested');
      const d = document.createElement('div'); d.className = 'it';
      d.innerHTML = `<img src="${it.image}" loading="lazy" onerror="this.src='${IMG_FB}'"/>
        <div class="tn" style="color:#e4ae39">${it.name}</div>
        <div class="tp" style="color:var(--ok)">${fmt(avgP)}</div>
        <div class="tb" style="background:#e4ae39"></div>`;
      rg.appendChild(d);
    });
  } else rl.style.display = 'none';

  updateCost();
  $('cmo').classList.add('on');
}
function closeModal() { $('cmo').classList.remove('on'); }
$('cmo').onclick = e => { if (e.target === $('cmo')) closeModal(); };
function setQty(n, b) {
  qty = n;
  document.querySelectorAll('.qbtn').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); updateCost();
}
function updateCost() {
  const cost = getCaseOpenCost(curCase) * qty;
  $('ctxt').textContent = `本次花费: ${fmt(cost)}（×${qty}）`;
  $('bop').textContent = `🔑 开箱 ×${qty}`;
  const ev = calcEV(curCase);
  const roi = (ev - getCaseOpenCost(curCase)) * qty;
  $('ev-txt').textContent = `期望总收益: ${roi>=0?'+':''}${fmt(roi)}`;
  $('ev-txt').style.color = roi >= 0 ? 'var(--ok)' : 'var(--danger)';
}

// ══════════════════════════════════════════════
//  OPEN
// ══════════════════════════════════════════════
function doOpen() {
  const cost = getCaseOpenCost(curCase) * qty;
  if (bal < cost) { toast('余额不足，请充值！','err'); return; }
  bal -= cost; opens += qty; save(); updateBal(); closeModal();
  qty === 1 ? spinSingle() : multiOpen();
}

function spinSingle() {
  const item = roll(curCase); lastItem = item;
  const track = $('track');
  track.style.transition = 'none'; track.style.transform = 'translateX(0)'; track.innerHTML = '';

  // 生成58个随机道具 + 最后1个是结果
  const items = []; for (let i = 0; i < 58; i++) items.push(roll(curCase)); items.push(item);
  const IW = 136;
  items.forEach(it => {
    const d = document.createElement('div'); d.className = 'sc'; d.style.borderColor = it.r.c;
    const name = (it.stattrak ? 'ST™ ' : '') + it.name;
    d.innerHTML = `<img src="${it.image}" loading="lazy" onerror="this.src='${IMG_FB}'"/>
      <div class="sn" style="color:${it.r.c}">${name}</div>`;
    track.appendChild(d);
  });

  $('rp').classList.remove('on'); $('mpanel').classList.remove('on');
  $('tw').style.display = ''; $('slbl').textContent = '🎰 开箱中…'; $('sov').classList.add('on');

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const target = 58 * IW + IW / 2 + (Math.random() - .5) * 50;
    track.style.transition = 'transform 4s cubic-bezier(0.15,1,0.25,1)';
    track.style.transform = `translateX(calc(-${target}px))`;
    setTimeout(() => showSingle(item), 4350);
  }));
}

function showSingle(item) {
  $('ri').src = item.image;
  const fullName = (item.stattrak ? 'StatTrak™ ' : '') + item.name;
  $('rn').textContent = fullName;
  $('rr').textContent = item.r.l; $('rr').style.color = item.r.c;
  $('rw').textContent = item.wear;
  $('rf').textContent = `Float: ${item.flt}`;
  $('rprice').textContent = fmt(item.p);
  $('rprice-sub').textContent = `≈ ¥${(item.p * 7.2).toFixed(0)} (人民币参考)`;

  const card = $('rc'); card.style.borderColor = item.r.c; card.style.color = item.r.c;
  if (item.isRare || item.rarKey === 'covert') card.classList.add('knife-flash');
  else card.classList.remove('knife-flash');

  $('bs1').textContent = `💰 卖出 ${fmt(item.p)}`;
  addInv(item); addHist(item); $('rp').classList.add('on');
}

function multiOpen() {
  const results = []; for (let i = 0; i < qty; i++) results.push(roll(curCase));
  lastMulti = results;
  results.forEach(r => { addInv(r); addHist(r); }); save();

  const g = $('mgrid'); g.innerHTML = '';
  results.forEach((it, i) => {
    const d = document.createElement('div'); d.className = 'mcard';
    d.style.borderColor = it.r.c; d.style.animationDelay = (i * 60) + 'ms';
    const name = (it.stattrak ? 'ST™ ' : '') + it.name;
    d.innerHTML = `<img src="${it.image}" loading="lazy" onerror="this.src='${IMG_FB}'"/>
      <div class="mc-n" style="color:${it.r.c}">${name}</div>
      <div class="mc-w">${it.wear}</div>
      <div class="mc-p">${fmt(it.p)}</div>`;
    g.appendChild(d);
  });

  const total = results.reduce((s, r) => s + r.p, 0);
  const cost = getCaseOpenCost(curCase) * qty;
  const roi = total - cost;
  $('mtot').innerHTML = `总价值: <span>${fmt(total)}</span> &nbsp; 
    收益: <span style="color:${roi>=0?'var(--ok)':'var(--danger)'}">
    ${roi>=0?'+':''}${fmt(roi)}</span>`;

  $('tw').style.display = 'none'; $('rp').classList.remove('on'); $('mpanel').classList.add('on');
  $('slbl').textContent = ''; $('sov').classList.add('on');
}

function sell1() {
  if (!lastItem) return;
  bal += lastItem.p;
  const idx = inv.findIndex(i => i._uid === lastItem._uid);
  if (idx !== -1) inv.splice(idx, 1);
  save(); updateBal(); toast(`卖出 ${lastItem.name} +${fmt(lastItem.p)}`,'ok'); closeSpin();
}
function sellAll() {
  if (!lastMulti) return;
  let t = 0;
  lastMulti.forEach(it => { t += it.p; const idx = inv.findIndex(i => i._uid === it._uid); if (idx !== -1) inv.splice(idx, 1); });
  bal += t; save(); updateBal(); toast(`全部卖出 +${fmt(t)}`,'ok'); closeSpin();
}
function again() { closeSpin(); openModal(curCase); }
function closeSpin() {
  $('sov').classList.remove('on'); $('rp').classList.remove('on'); $('mpanel').classList.remove('on');
  lastItem = null; lastMulti = null;
}

// ══════════════════════════════════════════════
//  INVENTORY
// ══════════════════════════════════════════════
function addInv(item) { inv.unshift(item); save(); }
function buildInvChips() {
  const rs = [{k:'all',l:'全部',c:'var(--txt)'},{k:'gold',l:'★ 刀/手套',c:'#e4ae39'},{k:'covert',l:'Covert',c:'#eb4b4b'},{k:'classified',l:'Classified',c:'#d32ce6'},{k:'restricted',l:'Restricted',c:'#8847ff'},{k:'milspec',l:'Mil-Spec',c:'#4b69ff'}];
  const w = $('ic');
  rs.forEach(r => {
    const b = document.createElement('button'); b.className = 'chip' + (r.k==='all'?' on':'');
    b.textContent = r.l; b.style.color = r.c;
    b.onclick = () => { invF = r.k; w.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); renderInv(); };
    w.appendChild(b);
  });
}
function renderInv() {
  let list = invF === 'all' ? [...inv] : inv.filter(i => i.rarKey === invF || i.r?.k === invF);
  $('sc').textContent = inv.length;
  $('sv').textContent = fmt(inv.reduce((s, i) => s + (i.p||0), 0));
  $('so').textContent = opens;
  const best = inv.reduce((b, i) => i.p > (b?.p||0) ? i : b, null);
  $('sbest').textContent = best ? fmt(best.p) : '—';
  const g = $('ig'); g.innerHTML = '';
  if (!list.length) {
    g.innerHTML = `<div class="empty">${invF!=='all'?'该稀有度暂无物品':'背包是空的，去开箱吧！'}</div>`; return;
  }
  list.forEach(item => {
    const d = document.createElement('div'); d.className = 'icard'; d.style.borderColor = item.r?.c||'#555';
    const name = (item.stattrak ? 'ST™ ' : '') + (item.name||'');
    d.innerHTML = `<button class="ic-sell" onclick="sellInv('${item._uid}',event)">卖 ${fmt(item.p)}</button>
      <img src="${item.image||''}" loading="lazy" onerror="this.src='${IMG_FB}'"/>
      <div class="ic-n" style="color:${item.r?.c||'#aaa'}">${name}</div>
      <div class="ic-w">${item.wear||''}</div>
      <div class="ic-p">${fmt(item.p)}</div>`;
    g.appendChild(d);
  });
}
function sellInv(uid, e) {
  e.stopPropagation();
  const idx = inv.findIndex(i => i._uid === uid); if (idx === -1) return;
  const it = inv[idx]; bal += it.p; inv.splice(idx, 1); save(); updateBal();
  toast(`卖出 +${fmt(it.p)}`,'ok'); renderInv();
}

// ══════════════════════════════════════════════
//  HISTORY
// ══════════════════════════════════════════════
function addHist(item) {
  hist.unshift({
    name: (item.stattrak?'StatTrak™ ':'')+item.name,
    image: item.image, wear: item.wear,
    r: item.r, rarKey: item.rarKey,
    p: item.p, isRare: item.isRare,
    case: curCase?.name||'', ts: Date.now(),
  });
  if (hist.length > 300) hist.pop(); save();
}
function ago(ts) {
  const s = Math.floor((Date.now()-ts)/1000);
  if (s<60) return '刚刚'; if(s<3600) return Math.floor(s/60)+'分钟前';
  if(s<86400) return Math.floor(s/3600)+'小时前'; return Math.floor(s/86400)+'天前';
}
function renderHist() {
  const l = $('hl');
  if (!hist.length) { l.innerHTML='<div style="color:var(--muted);padding:50px;text-align:center">暂无记录</div>'; return; }
  l.innerHTML = '';
  hist.slice(0, 200).forEach(h => {
    const d = document.createElement('div'); d.className = 'hi';
    d.innerHTML = `
      <div class="hbar" style="background:${h.r?.c||'#555'}"></div>
      <img class="himg" src="${h.image||''}" onerror="this.src='${IMG_FB}'"/>
      <div class="hinfo">
        <div class="hname" style="color:${h.r?.c||'var(--txt)'}">${h.name||''}</div>
        <div class="hmeta">${h.case} · ${h.wear||''}</div>
      </div>
      <div>
        <div class="hprice">${fmt(h.p)}</div>
        <div class="hprice-sub">≈¥${(h.p*7.2).toFixed(0)}</div>
      </div>
      <div class="htime">${ago(h.ts)}</div>`;
    l.appendChild(d);
  });
}

// ══════════════════════════════════════════════
//  SKINS PAGE
// ══════════════════════════════════════════════
function buildRarChips() {
  const rs = [{k:'all',l:'全部'},{k:'covert',l:'Covert',c:'#eb4b4b'},{k:'classified',l:'Classified',c:'#d32ce6'},{k:'restricted',l:'Restricted',c:'#8847ff'},{k:'milspec',l:'Mil-Spec',c:'#4b69ff'},{k:'industrial',l:'Industrial',c:'#5e98d9'},{k:'consumer',l:'Consumer',c:'#b0c3d9'}];
  const w = $('rc2');
  rs.forEach(r => {
    const b = document.createElement('button'); b.className = 'chip' + (r.k==='all'?' on':'');
    b.textContent = r.l; if (r.c) b.style.color = r.c;
    b.onclick = () => { rarF = r.k; w.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filterSkins(); };
    w.appendChild(b);
  });
}
function initSkins(skins) {
  skFiltered = [...skins]; skOff = 0;
  const w = $('sw'); w.innerHTML = '';
  const g = document.createElement('div'); g.className = 'sg'; g.id = 'sg'; w.appendChild(g);
  const sen = document.createElement('div'); sen.id = 'sen'; w.appendChild(sen);
  new IntersectionObserver(en => { if (en[0].isIntersecting) loadSkins(); }, {rootMargin:'300px'}).observe(sen);
  loadSkins();
}
function filterSkins() {
  const q = $('sq').value.toLowerCase();
  skFiltered = allSkins.filter(s => {
    const r = RARITY[s.rarity?.id]||{};
    return s.name.toLowerCase().includes(q) && (rarF==='all' || r.k===rarF);
  });
  skOff = 0; const g = $('sg'); if (g) g.innerHTML = '';
  loadSkins();
}
function loadSkins() {
  const g = $('sg'); if (!g) return;
  skFiltered.slice(skOff, skOff + SK_PER).forEach(s => {
    const r = RARITY[s.rarity?.id]||{l:'',c:'#555',k:'consumer'};
    const ftP = getSkinPrice(s.name, r.k, 'Field-Tested');
    const d = document.createElement('div'); d.className = 'skcard'; d.style.borderColor = r.c;
    d.innerHTML = `<img src="${s.image}" loading="lazy" onerror="this.src='${IMG_FB}'"/>
      <div class="sk-n">${s.name}</div>
      <div class="sk-r" style="color:${r.c}">${r.l}</div>
      <div class="sk-p">${fmt(ftP)}<span style="font-size:8px;color:var(--muted)"> FT</span></div>`;
    g.appendChild(d);
  });
  skOff += SK_PER;
}

// ══════════════════════════════════════════════
//  START
// ══════════════════════════════════════════════
updateBal();
load();
</script>
</body>
</html>
