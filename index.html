<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CS2 VAULT — 模拟开箱</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0c10;--s1:#13141a;--s2:#1a1c25;--s3:#212430;
  --border:#2c2f40;--accent:#e8a838;--accent2:#ffd166;
  --txt:#dde1f0;--muted:#6b7090;--danger:#e85555;--ok:#43e87a;
  --c-consumer:#b0c3d9;--c-industrial:#5e98d9;--c-milspec:#4b69ff;
  --c-restricted:#8847ff;--c-classified:#d32ce6;
  --c-covert:#eb4b4b;--c-gold:#e4ae39;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:90;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;height:62px;
  background:rgba(11,12,16,.92);border-bottom:1px solid var(--border);
  backdrop-filter:blur(10px);
}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;user-select:none}
.logo-hex{width:34px;height:34px}
.hdr-right{display:flex;align-items:center;gap:16px}
.bal-box{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:6px 14px}
.bal-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bal-val{font-size:17px;font-weight:800;color:var(--accent)}
.btn-topup{cursor:pointer;background:linear-gradient(135deg,#e8a838,#ffd166);color:#1a1000;font-size:12px;font-weight:800;border:none;border-radius:6px;padding:7px 14px;letter-spacing:.04em;transition:filter .2s,transform .15s}
.btn-topup:hover{filter:brightness(1.12);transform:translateY(-1px)}

/* ── NAV ── */
nav{display:flex;gap:2px;padding:0 28px;background:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto}
.nav-item{padding:13px 20px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s;letter-spacing:.03em;text-transform:uppercase}
.nav-item:hover{color:var(--txt)}
.nav-item.active{color:var(--accent);border-bottom-color:var(--accent)}

/* ── PAGES ── */
.page{display:none;padding:28px}
.page.active{display:block}

/* ── SECTION TITLE ── */
.sec-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border)}

/* ── SEARCH / FILTER BAR ── */
.bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.search-input{flex:1;min-width:200px;background:var(--s2);border:1px solid var(--border);color:var(--txt);padding:9px 16px;border-radius:8px;font-size:13px;outline:none;transition:border-color .2s}
.search-input:focus{border-color:var(--accent)}
.search-input::placeholder{color:var(--muted)}
.chip{padding:5px 13px;background:var(--s2);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.chip:hover,.chip.on{background:rgba(232,168,56,.12);border-color:var(--accent);color:var(--accent)}

/* ── CASES GRID ── */
.cases-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
.case-card{
  background:var(--s1);border:1px solid var(--border);border-radius:12px;
  padding:18px 14px 14px;cursor:pointer;text-align:center;
  transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden
}
.case-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(232,168,56,.06),transparent);opacity:0;transition:opacity .2s}
.case-card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 10px 30px rgba(232,168,56,.12)}
.case-card:hover::after{opacity:1}
.case-badge{position:absolute;top:8px;right:8px;font-size:9px;font-weight:800;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em;background:rgba(232,168,56,.15);color:var(--accent)}
.case-img{width:116px;height:88px;object-fit:contain;display:block;margin:0 auto 12px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.55));transition:transform .2s}
.case-card:hover .case-img{transform:scale(1.06)}
.case-name{font-size:12px;font-weight:700;line-height:1.4;margin-bottom:10px;color:var(--txt)}
.case-price{font-size:15px;font-weight:800;color:var(--accent)}

/* ── LOADING ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:14px;color:var(--muted)}
.spinner{width:38px;height:38px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── MODAL ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.overlay.open{display:flex}
.modal{
  background:var(--s1);border:1px solid var(--border);border-radius:18px;
  width:92vw;max-width:880px;max-height:92vh;overflow-y:auto;padding:30px;position:relative
}
.modal-x{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;line-height:1;transition:color .2s}
.modal-x:hover{color:var(--danger)}
.modal-top{display:flex;gap:22px;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap}
.modal-cimg{width:130px;height:98px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));flex-shrink:0}
.modal-info{flex:1}
.modal-title{font-size:21px;font-weight:900;color:var(--accent);margin-bottom:5px}
.modal-sub{font-size:13px;color:var(--muted)}
.modal-sub span{color:var(--txt)}

/* ── CONTAINS GRID ── */
.sub-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:10px}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-bottom:18px}
.item-thumb{
  background:var(--s2);border-radius:8px;padding:9px 7px;text-align:center;
  border:1px solid var(--border);transition:border-color .2s;position:relative
}
.item-thumb:hover{border-color:var(--muted)}
.item-thumb img{width:68px;height:52px;object-fit:contain;display:block;margin:0 auto 5px}
.item-thumb .t-name{font-size:10px;line-height:1.3;color:var(--txt)}
.item-thumb .t-bar{height:2px;border-radius:2px;margin-top:5px}

/* ── OPEN CONTROLS ── */
.open-row{display:flex;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.qty-btns{display:flex;gap:6px}
.qty-btn{padding:8px 13px;background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--txt);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.qty-btn.on,.qty-btn:hover{background:rgba(232,168,56,.12);border-color:var(--accent);color:var(--accent)}
.btn-open{
  flex:1;min-width:140px;padding:12px 24px;
  background:linear-gradient(135deg,#e8a838,#ffd166);color:#1a1000;
  font-size:15px;font-weight:900;border:none;border-radius:9px;cursor:pointer;
  letter-spacing:.05em;text-transform:uppercase;transition:filter .2s,transform .15s
}
.btn-open:hover{filter:brightness(1.1);transform:translateY(-1px)}
.cost-txt{font-size:12px;color:var(--muted)}

/* ── SPIN ── */
.spin-ov{display:none;position:fixed;inset:0;background:rgba(7,8,12,.96);z-index:300;flex-direction:column;align-items:center;justify-content:center;gap:0}
.spin-ov.open{display:flex}
.spin-label{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:26px}
.track-wrap{width:100%;max-width:820px;overflow:hidden;padding:0 24px;position:relative}
.track-wrap::before,.track-wrap::after{content:'';position:absolute;top:0;bottom:0;width:130px;z-index:2;pointer-events:none}
.track-wrap::before{left:24px;background:linear-gradient(to right,rgba(7,8,12,.95),transparent)}
.track-wrap::after{right:24px;background:linear-gradient(to left,rgba(7,8,12,.95),transparent)}
.pointer{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:3px;background:var(--accent);z-index:5;box-shadow:0 0 18px var(--accent)}
.pointer::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-top-color:var(--accent)}
.pointer::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-bottom-color:var(--accent)}
.track{display:flex;gap:8px;will-change:transform;padding:0 50%}
.spin-card{flex-shrink:0;width:136px;background:var(--s1);border:2px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center}
.spin-card img{width:96px;height:72px;object-fit:contain;display:block;margin:0 auto 6px}
.spin-card .sc-name{font-size:10px;font-weight:700;line-height:1.3;color:var(--txt)}

/* ── RESULT ── */
.result-panel{display:none;flex-direction:column;align-items:center;gap:18px;margin-top:34px;text-align:center}
.result-panel.show{display:flex}
.res-card{background:var(--s1);border:2px solid;border-radius:16px;padding:32px 44px;position:relative;overflow:hidden}
.res-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,currentColor,transparent 65%);opacity:.07}
.res-card img{width:190px;height:144px;object-fit:contain;display:block;margin:0 auto 16px;filter:drop-shadow(0 8px 22px rgba(0,0,0,.7))}
.res-name{font-size:20px;font-weight:900}
.res-rarity{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
.res-wear{font-size:13px;color:var(--muted);margin-top:4px}
.res-float{font-size:11px;color:var(--muted);margin-top:2px}
.res-price{font-size:17px;font-weight:800;color:var(--ok);margin-top:8px}
.res-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn-sell{padding:10px 22px;background:rgba(67,232,122,.1);border:1px solid var(--ok);color:var(--ok);font-size:14px;font-weight:800;border-radius:8px;cursor:pointer;transition:background .2s}
.btn-sell:hover{background:rgba(67,232,122,.22)}
.btn-again{padding:10px 22px;background:linear-gradient(135deg,#e8a838,#ffd166);color:#1a1000;font-size:14px;font-weight:900;border:none;border-radius:8px;cursor:pointer;transition:filter .2s}
.btn-again:hover{filter:brightness(1.1)}
.btn-close2{padding:10px 18px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:14px;border-radius:8px;cursor:pointer;transition:all .2s}
.btn-close2:hover{color:var(--txt);border-color:var(--txt)}

/* ── MULTI RESULTS ── */
.multi-panel{display:none;flex-direction:column;align-items:center;gap:16px;width:90%;max-width:880px;margin-top:28px}
.multi-panel.show{display:flex}
.multi-header{font-size:17px;font-weight:900;color:var(--accent)}
.multi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px;width:100%}
.m-card{background:var(--s1);border:2px solid;border-radius:10px;padding:11px 8px;text-align:center;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.m-card img{width:82px;height:62px;object-fit:contain;display:block;margin:0 auto 6px}
.m-card .mc-name{font-size:10px;font-weight:700;line-height:1.3}
.m-card .mc-wear{font-size:9px;color:var(--muted);margin-top:2px}
.m-total{font-size:14px;color:var(--muted)}
.m-total span{color:var(--ok);font-weight:800}

/* ── INVENTORY ── */
.stats-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.stat-box{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:14px 20px;min-width:130px}
.stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.stat-val{font-size:22px;font-weight:900;color:var(--accent);margin-top:4px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:11px}
.inv-card{
  background:var(--s1);border:2px solid;border-radius:10px;padding:11px 8px;
  text-align:center;cursor:default;position:relative;
  transition:transform .15s,box-shadow .15s
}
.inv-card:hover{transform:translateY(-3px);box-shadow:0 6px 22px rgba(0,0,0,.4)}
.inv-card img{width:82px;height:62px;object-fit:contain;display:block;margin:0 auto 7px}
.inv-card .ic-name{font-size:10px;font-weight:700;line-height:1.3}
.inv-card .ic-wear{font-size:9px;color:var(--muted);margin-top:2px}
.ic-sell{position:absolute;top:4px;right:4px;background:rgba(67,232,122,.14);border:none;border-radius:4px;color:var(--ok);font-size:9px;font-weight:800;padding:2px 6px;cursor:pointer;display:none;transition:background .2s}
.inv-card:hover .ic-sell{display:block}
.ic-sell:hover{background:rgba(67,232,122,.3)}
.empty{text-align:center;padding:70px 20px;color:var(--muted);grid-column:1/-1}
.empty svg{width:60px;height:60px;opacity:.25;margin:0 auto 14px;display:block}

/* ── HISTORY ── */
.hist-list{display:flex;flex-direction:column;gap:9px}
.hist-item{display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:12px 16px;animation:slideR .3s ease}
@keyframes slideR{from{opacity:0;transform:translateX(-10px)}to{opacity:1}}
.hist-bar{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0}
.hist-img{width:60px;height:46px;object-fit:contain;flex-shrink:0}
.hist-info{flex:1}
.hist-name{font-size:13px;font-weight:800}
.hist-meta{font-size:11px;color:var(--muted);margin-top:2px}
.hist-price{font-size:14px;font-weight:800;color:var(--ok)}
.hist-time{font-size:10px;color:var(--muted);flex-shrink:0}

/* ── SKINS PAGE ── */
.skins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:11px}
.skin-card{background:var(--s1);border:2px solid;border-radius:10px;padding:11px 8px;text-align:center;transition:transform .15s,box-shadow .15s}
.skin-card:hover{transform:translateY(-3px);box-shadow:0 6px 22px rgba(0,0,0,.4)}
.skin-card img{width:82px;height:62px;object-fit:contain;display:block;margin:0 auto 7px}
.skin-card .sk-name{font-size:10px;font-weight:700;line-height:1.3}
.skin-card .sk-rarity{font-size:9px;margin-top:3px;font-weight:600}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;
  background:var(--s2);border:1px solid var(--border);
  padding:13px 18px;border-radius:10px;font-size:13px;
  z-index:999;transform:translateY(80px);opacity:0;
  transition:transform .3s,opacity .3s;max-width:280px;line-height:1.4
}
.toast.show{transform:translateY(0);opacity:1}
.toast.ok{border-color:var(--ok);color:var(--ok)}
.toast.err{border-color:var(--danger);color:var(--danger)}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  header{padding:0 14px}.logo-hex{width:28px;height:28px}
  .logo{font-size:16px}.bal-val{font-size:14px}
  nav{padding:0 8px}.nav-item{padding:11px 12px;font-size:11px}
  .page{padding:16px}.cases-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .modal{padding:18px}.res-card{padding:20px 16px}
  .spin-card{width:112px}
}
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <svg class="logo-hex" viewBox="0 0 40 40" fill="none">
      <polygon points="20,3 37,12 37,28 20,37 3,28 3,12" fill="rgba(232,168,56,.12)" stroke="#e8a838" stroke-width="1.5"/>
      <polygon points="20,9 31,15.5 31,25.5 20,32 9,25.5 9,15.5" fill="rgba(232,168,56,.07)" stroke="#e8a838" stroke-width="1"/>
      <circle cx="20" cy="20" r="5" fill="#e8a838"/>
      <circle cx="20" cy="20" r="2.5" fill="#1a1000"/>
    </svg>
    CS2 VAULT
  </div>
  <div class="hdr-right">
    <div class="bal-box">
      <span class="bal-label">余额</span>
      <span class="bal-val" id="bal">$1,000.00</span>
    </div>
    <button class="btn-topup" onclick="topUp()">+ 充值</button>
  </div>
</header>

<!-- NAV -->
<nav>
  <div class="nav-item active" onclick="gotoPage('cases',this)">🎁 武器箱</div>
  <div class="nav-item" onclick="gotoPage('skins',this)">🔫 皮肤库</div>
  <div class="nav-item" onclick="gotoPage('inv',this)">🎒 背包</div>
  <div class="nav-item" onclick="gotoPage('hist',this)">📜 记录</div>
</nav>

<!-- ══ PAGE: CASES ══ -->
<div class="page active" id="page-cases">
  <div class="sec-title">选择武器箱</div>
  <div class="bar">
    <input class="search-input" id="case-q" placeholder="🔍 搜索武器箱…" oninput="filterCases()"/>
    <div id="type-chips"></div>
  </div>
  <div id="cases-wrap">
    <div class="loading"><div class="spinner"></div><span>加载数据中…</span></div>
  </div>
</div>

<!-- ══ PAGE: SKINS ══ -->
<div class="page" id="page-skins">
  <div class="sec-title">全部皮肤</div>
  <div class="bar">
    <input class="search-input" id="skin-q" placeholder="🔍 搜索皮肤名称…" oninput="filterSkins()"/>
    <div id="rarity-chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
  <div id="skins-wrap">
    <div class="loading"><div class="spinner"></div><span>加载皮肤库…</span></div>
  </div>
</div>

<!-- ══ PAGE: INVENTORY ══ -->
<div class="page" id="page-inv">
  <div class="sec-title">我的背包</div>
  <div class="stats-row">
    <div class="stat-box"><div class="stat-lbl">物品总数</div><div class="stat-val" id="s-count">0</div></div>
    <div class="stat-box"><div class="stat-lbl">总价值</div><div class="stat-val" id="s-val">$0</div></div>
    <div class="stat-box"><div class="stat-lbl">开箱次数</div><div class="stat-val" id="s-opens">0</div></div>
    <div class="stat-box"><div class="stat-lbl">最贵物品</div><div class="stat-val" id="s-best">—</div></div>
  </div>
  <div class="bar">
    <div id="inv-chips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
  <div class="inv-grid" id="inv-grid"></div>
</div>

<!-- ══ PAGE: HISTORY ══ -->
<div class="page" id="page-hist">
  <div class="sec-title">开箱记录</div>
  <div class="hist-list" id="hist-list"></div>
</div>

<!-- ══ CASE MODAL ══ -->
<div class="overlay" id="case-modal">
  <div class="modal">
    <button class="modal-x" onclick="closeModal()">✕</button>
    <div class="modal-top">
      <img id="mc-img" src="" class="modal-cimg"/>
      <div class="modal-info">
        <div class="modal-title" id="mc-name"></div>
        <div class="modal-sub" id="mc-sub"></div>
      </div>
    </div>
    <div class="sub-title">箱内物品</div>
    <div class="items-grid" id="mc-items"></div>
    <div class="sub-title" id="rare-lbl" style="color:var(--c-gold)">★ 稀有特殊物品</div>
    <div class="items-grid" id="mc-rare"></div>
    <div class="open-row">
      <div class="qty-btns">
        <button class="qty-btn on" onclick="setQty(1,this)">×1</button>
        <button class="qty-btn" onclick="setQty(3,this)">×3</button>
        <button class="qty-btn" onclick="setQty(5,this)">×5</button>
        <button class="qty-btn" onclick="setQty(10,this)">×10</button>
      </div>
      <button class="btn-open" id="btn-open" onclick="doOpen()">🔑 开箱</button>
      <span class="cost-txt" id="cost-txt"></span>
    </div>
  </div>
</div>

<!-- ══ SPIN OVERLAY ══ -->
<div class="spin-ov" id="spin-ov">
  <div class="spin-label" id="spin-lbl">🎰 开箱中…</div>
  <div class="track-wrap" id="track-wrap">
    <div class="pointer"></div>
    <div class="track" id="track"></div>
  </div>
  <!-- Single result -->
  <div class="result-panel" id="res-panel">
    <div class="res-card" id="res-card">
      <img id="res-img" src=""/>
      <div class="res-name" id="res-name"></div>
      <div class="res-rarity" id="res-rar"></div>
      <div class="res-wear" id="res-wear"></div>
      <div class="res-float" id="res-float"></div>
      <div class="res-price" id="res-price"></div>
    </div>
    <div class="res-actions">
      <button class="btn-sell" id="btn-sell1" onclick="sell1()">💰 卖出</button>
      <button class="btn-again" onclick="again()">🔑 再来一次</button>
      <button class="btn-close2" onclick="closeSpin()">关闭</button>
    </div>
  </div>
  <!-- Multi result -->
  <div class="multi-panel" id="multi-panel">
    <div class="multi-header">开箱结果</div>
    <div class="multi-grid" id="multi-grid"></div>
    <div class="m-total" id="m-total"></div>
    <div class="res-actions">
      <button class="btn-sell" onclick="sellAll()">💰 全部卖出</button>
      <button class="btn-again" onclick="again()">🔑 再来一次</button>
      <button class="btn-close2" onclick="closeSpin()">关闭</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════
const API = 'https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en';
const CASE_PRICE = 2.50;
const KEY_PRICE  = 0;  // key included in price for simplicity

const RARITY = {
  rarity_consumer_weapon:  {l:'Consumer Grade', c:'#b0c3d9', k:'consumer'},
  rarity_common:           {l:'Consumer Grade', c:'#b0c3d9', k:'consumer'},
  rarity_uncommon_weapon:  {l:'Industrial Grade',c:'#5e98d9',k:'industrial'},
  rarity_rare_weapon:      {l:'Mil-Spec Grade',  c:'#4b69ff',k:'milspec'},
  rarity_mythical_weapon:  {l:'Restricted',      c:'#8847ff',k:'restricted'},
  rarity_legendary_weapon: {l:'Classified',      c:'#d32ce6',k:'classified'},
  rarity_ancient_weapon:   {l:'Covert',          c:'#eb4b4b',k:'covert'},
  rarity_ancient:          {l:'Covert',          c:'#eb4b4b',k:'covert'},
  rarity_contraband:       {l:'Contraband',      c:'#e4ae39',k:'gold'},
};
const WEAR = ['Factory New','Minimal Wear','Field-Tested','Well-Worn','Battle-Scarred'];

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
let bal      = +localStorage.getItem('bal')||1000;
let inv      = JSON.parse(localStorage.getItem('inv')||'[]');
let hist     = JSON.parse(localStorage.getItem('hist')||'[]');
let opens    = +localStorage.getItem('opens')||0;

let allCases = [], allSkins = [];
let curCase  = null, qty = 1;
let lastItem = null, lastMulti = null;
let caseTypeFilter = 'all', rarityFilter = 'all', invFilter = 'all';
let skinsOffset = 0, skinsFiltered = [];
const PER_PAGE = 120;

// ════════════════════════════════════════════
//  PERSIST
// ════════════════════════════════════════════
function save(){
  localStorage.setItem('bal', bal.toFixed(2));
  localStorage.setItem('inv', JSON.stringify(inv));
  localStorage.setItem('hist', JSON.stringify(hist));
  localStorage.setItem('opens', opens);
}

// ════════════════════════════════════════════
//  UTILS
// ════════════════════════════════════════════
const $  = id => document.getElementById(id);
const fmt = n  => '$'+parseFloat(n).toFixed(2);
function updateBal(){ $('bal').textContent = fmt(bal); }

function toast(msg, type=''){
  const t=$('toast'); t.textContent=msg;
  t.className='toast show'+(type?' '+type:'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',2800);
}
function topUp(){ bal+=100; save(); updateBal(); toast('+$100 充值成功','ok'); }

function gotoPage(id, el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  $('page-'+id).classList.add('active');
  el.classList.add('active');
  if(id==='inv')  renderInv();
  if(id==='hist') renderHist();
}

function rarity(item){ return RARITY[item?.rarity?.id]||{l:'',c:'#555',k:'consumer'}; }

function price(rKey, wear){
  const base={consumer:.05,industrial:.12,milspec:.4,restricted:1.5,classified:9,covert:50,gold:220};
  const wm=[1.3,1.15,.95,.75,.55]; const wi=WEAR.indexOf(wear);
  return +((base[rKey]||.1)*(wi>=0?wm[wi]:1)*(0.65+Math.random()*.7)).toFixed(2);
}

// ════════════════════════════════════════════
//  LOAD DATA
// ════════════════════════════════════════════
async function load(){
  try{
    const [cr,sk] = await Promise.all([
      fetch(API+'/crates.json').then(r=>r.json()),
      fetch(API+'/skins.json').then(r=>r.json())
    ]);
    allCases = cr.filter(c=>c.contains&&c.contains.length>0&&
      (c.type==='Case'||c.type==='Capsule'||c.type==='Souvenir'||c.type==='Package'));
    allSkins = sk;
    renderCases(allCases);
    initSkinsPage(allSkins);
    buildTypeChips();
    buildRarityChips();
    buildInvChips();
  }catch(e){
    $('cases-wrap').innerHTML=`<div style="color:var(--danger);padding:60px;text-align:center">⚠️ 数据加载失败，请刷新重试。<br><small>${e.message}</small></div>`;
  }
}

// ════════════════════════════════════════════
//  CASES PAGE
// ════════════════════════════════════════════
function buildTypeChips(){
  const types=['全部','Case','Souvenir','Capsule','Package'];
  const wrap=document.createElement('div');
  wrap.style.cssText='display:flex;gap:6px;flex-wrap:wrap';
  types.forEach(t=>{
    const c=document.createElement('button');
    c.className='chip'+(t==='全部'?' on':'');
    c.textContent=t;
    c.onclick=()=>{
      caseTypeFilter=(t==='全部'?'all':t);
      wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
      c.classList.add('on');
      filterCases();
    };
    wrap.appendChild(c);
  });
  $('type-chips').appendChild(wrap);
}

function filterCases(){
  const q=$('case-q').value.toLowerCase();
  const f=allCases.filter(c=>{
    const mq=c.name.toLowerCase().includes(q);
    const mt=caseTypeFilter==='all'||c.type===caseTypeFilter;
    return mq&&mt;
  });
  renderCases(f);
}

function renderCases(list){
  const wrap=$('cases-wrap');
  if(!list.length){wrap.innerHTML='<div style="color:var(--muted);padding:60px;text-align:center">没有找到匹配的武器箱</div>';return;}
  const grid=document.createElement('div');
  grid.className='cases-grid';
  list.forEach(c=>{
    const d=document.createElement('div');
    d.className='case-card';
    d.innerHTML=`
      ${c.type?`<div class="case-badge">${c.type}</div>`:''}
      <img class="case-img" src="${c.image}" loading="lazy" onerror="this.style.opacity='.3'"/>
      <div class="case-name">${c.name}</div>
      <div class="case-price">${fmt(CASE_PRICE)}</div>`;
    d.onclick=()=>openModal(c);
    grid.appendChild(d);
  });
  wrap.innerHTML='';
  wrap.appendChild(grid);
}

// ════════════════════════════════════════════
//  MODAL
// ════════════════════════════════════════════
function openModal(c){
  curCase=c; qty=1;
  document.querySelectorAll('.qty-btn').forEach((b,i)=>b.classList.toggle('on',i===0));
  $('mc-img').src=c.image;
  $('mc-name').textContent=c.name;
  $('mc-sub').innerHTML=`类型 <span>${c.type||'—'}</span> &nbsp;·&nbsp; 首发 <span>${c.first_sale_date||'—'}</span>`;
  // contains
  const ig=$('mc-items'); ig.innerHTML='';
  (c.contains||[]).forEach(it=>{
    const r=rarity(it);
    const d=document.createElement('div'); d.className='item-thumb';
    d.innerHTML=`<img src="${it.image}" loading="lazy" onerror="this.style.opacity='.2'"/>
      <div class="t-name">${it.name}</div>
      <div class="t-bar" style="background:${r.c}"></div>`;
    ig.appendChild(d);
  });
  // rare
  const rg=$('mc-rare'),rl=$('rare-lbl'); rg.innerHTML='';
  if(c.contains_rare&&c.contains_rare.length){
    rl.style.display=''; 
    c.contains_rare.forEach(it=>{
      const d=document.createElement('div'); d.className='item-thumb';
      d.innerHTML=`<img src="${it.image}" loading="lazy"/>
        <div class="t-name" style="color:var(--c-gold)">${it.name}</div>
        <div class="t-bar" style="background:var(--c-gold)"></div>`;
      rg.appendChild(d);
    });
  } else rl.style.display='none';
  updateCost();
  $('case-modal').classList.add('open');
}
function closeModal(){ $('case-modal').classList.remove('open'); }
$('case-modal').onclick=e=>{ if(e.target===$('case-modal')) closeModal(); };

function setQty(n,btn){ qty=n; document.querySelectorAll('.qty-btn').forEach(b=>b.classList.remove('on')); btn.classList.add('on'); updateCost(); }
function updateCost(){
  const total=(CASE_PRICE*qty).toFixed(2);
  $('cost-txt').textContent=`花费: $${total}`;
  $('btn-open').textContent=`🔑 开箱 ×${qty}`;
}

// ════════════════════════════════════════════
//  ROLL LOGIC
// ════════════════════════════════════════════
function roll(c){
  const pool=[...(c.contains||[])];
  const rare=[...(c.contains_rare||[])];
  // build weighted array
  const W={milspec:8000,restricted:1600,classified:320,covert:64,gold:26,consumer:1,industrial:1};
  const arr=[];
  pool.forEach(it=>{
    const k=rarity(it).k;
    const w=W[k]||100;
    for(let i=0;i<w;i++) arr.push({...it, _rare:false});
  });
  if(rare.length){
    const rw=W.gold;
    for(let i=0;i<rw;i++) arr.push({...rare[Math.floor(Math.random()*rare.length)], _rare:true});
  }
  const chosen=arr[Math.floor(Math.random()*arr.length)];
  const wearIdx=Math.floor(Math.random()*5);
  const wear=WEAR[wearIdx];
  const flt=(Math.random()*.95+.01).toFixed(6);
  const r=rarity(chosen);
  const p=price(r.k, wear);
  return {...chosen, wear, flt, r, p, _uid:Date.now()+Math.random().toString(36).slice(2)};
}

// ════════════════════════════════════════════
//  OPEN
// ════════════════════════════════════════════
function doOpen(){
  const cost=CASE_PRICE*qty;
  if(bal<cost){ toast('余额不足，请充值！','err'); return; }
  bal-=cost; opens+=qty; save(); updateBal(); closeModal();
  if(qty===1) spinSingle(); else multiOpen();
}

/* ── SINGLE SPIN ── */
function spinSingle(){
  const item=roll(curCase); lastItem=item;
  const track=$('track'); track.style.transition='none'; track.style.transform='translateX(0)'; track.innerHTML='';
  const items=[]; for(let i=0;i<58;i++) items.push(roll(curCase)); items.push(item);
  const IW=144;
  items.forEach(it=>{
    const d=document.createElement('div'); d.className='spin-card'; d.style.borderColor=it.r.c;
    d.innerHTML=`<img src="${it.image}" loading="lazy" onerror="this.style.opacity='.2'"/><div class="sc-name">${it.name}</div>`;
    track.appendChild(d);
  });
  $('res-panel').classList.remove('show');
  $('multi-panel').classList.remove('show');
  $('track-wrap').style.display='';
  $('spin-lbl').textContent='🎰 开箱中…';
  $('spin-ov').classList.add('open');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const target=58*IW+IW/2+(Math.random()-.5)*55;
    track.style.transition='transform 4s cubic-bezier(0.15,1,0.25,1)';
    track.style.transform=`translateX(calc(-${target}px))`;
    setTimeout(()=>showSingle(item),4300);
  }));
}
function showSingle(item){
  $('res-img').src=item.image;
  $('res-name').textContent=item.name;
  $('res-rar').textContent=item.r.l; $('res-rar').style.color=item.r.c;
  $('res-wear').textContent=item.wear;
  $('res-float').textContent='Float: '+item.flt;
  $('res-price').textContent=fmt(item.p);
  const card=$('res-card'); card.style.borderColor=item.r.c; card.style.color=item.r.c;
  $('btn-sell1').textContent=`💰 卖出 ${fmt(item.p)}`;
  addInv(item); addHist(item);
  $('res-panel').classList.add('show');
}

/* ── MULTI ── */
function multiOpen(){
  const results=[]; for(let i=0;i<qty;i++) results.push(roll(curCase));
  lastMulti=results;
  results.forEach(r=>{addInv(r);addHist(r);}); save();
  const grid=$('multi-grid'); grid.innerHTML='';
  results.forEach((it,i)=>{
    const d=document.createElement('div'); d.className='m-card'; d.style.borderColor=it.r.c; d.style.animationDelay=(i*60)+'ms';
    d.innerHTML=`<img src="${it.image}" loading="lazy"/><div class="mc-name">${it.name}</div><div class="mc-wear">${it.wear}</div>`;
    grid.appendChild(d);
  });
  const total=results.reduce((s,r)=>s+r.p,0);
  $('m-total').innerHTML=`总价值: <span>${fmt(total)}</span>`;
  $('track-wrap').style.display='none';
  $('res-panel').classList.remove('show');
  $('multi-panel').classList.add('show');
  $('spin-lbl').textContent='';
  $('spin-ov').classList.add('open');
}

function sell1(){
  if(!lastItem) return;
  bal+=lastItem.p;
  const idx=inv.findIndex(i=>i._uid===lastItem._uid);
  if(idx!==-1) inv.splice(idx,1);
  save(); updateBal(); toast(`卖出 ${lastItem.name} +${fmt(lastItem.p)}`,'ok'); closeSpin();
}
function sellAll(){
  if(!lastMulti) return;
  let t=0; lastMulti.forEach(it=>{ t+=it.p; const idx=inv.findIndex(i=>i._uid===it._uid); if(idx!==-1) inv.splice(idx,1); });
  bal+=t; save(); updateBal(); toast(`全部卖出 +${fmt(t)}`,'ok'); closeSpin();
}
function again(){ closeSpin(); openModal(curCase); }
function closeSpin(){
  $('spin-ov').classList.remove('open');
  $('res-panel').classList.remove('show');
  $('multi-panel').classList.remove('show');
  lastItem=null; lastMulti=null;
}

// ════════════════════════════════════════════
//  INVENTORY
// ════════════════════════════════════════════
function addInv(item){ inv.unshift(item); save(); }

function buildInvChips(){
  const rarities=[{k:'all',l:'全部',c:'var(--txt)'},{k:'covert',l:'Covert',c:'#eb4b4b'},{k:'classified',l:'Classified',c:'#d32ce6'},{k:'restricted',l:'Restricted',c:'#8847ff'},{k:'milspec',l:'Mil-Spec',c:'#4b69ff'},{k:'gold',l:'★ 特殊',c:'#e4ae39'}];
  const wrap=$('inv-chips');
  rarities.forEach(r=>{
    const b=document.createElement('button'); b.className='chip'+(r.k==='all'?' on':'');
    b.textContent=r.l; b.style.color=r.c;
    b.onclick=()=>{ invFilter=r.k; wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); renderInv(); };
    wrap.appendChild(b);
  });
}

function renderInv(){
  let list=invFilter==='all'?[...inv]:inv.filter(i=>i.r?.k===invFilter);
  $('s-count').textContent=inv.length;
  const tv=inv.reduce((s,i)=>s+(i.p||0),0);
  $('s-val').textContent=fmt(tv);
  $('s-opens').textContent=opens;
  const best=inv.reduce((b,i)=>i.p>(b?.p||0)?i:b,null);
  $('s-best').textContent=best?fmt(best.p):'—';
  const grid=$('inv-grid'); grid.innerHTML='';
  if(!list.length){
    grid.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2zM16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg><p>${invFilter!=='all'?'该稀有度暂无物品':'背包是空的，快去开箱！'}</p></div>`;
    return;
  }
  list.forEach(item=>{
    const d=document.createElement('div'); d.className='inv-card'; d.style.borderColor=item.r?.c||'#555';
    d.innerHTML=`<button class="ic-sell" onclick="sellInv('${item._uid}',event)">卖 ${fmt(item.p)}</button>
      <img src="${item.image}" loading="lazy" onerror="this.style.opacity='.2'"/>
      <div class="ic-name">${item.name}</div>
      <div class="ic-wear">${item.wear||''}</div>`;
    grid.appendChild(d);
  });
}
function sellInv(uid,e){
  e.stopPropagation();
  const idx=inv.findIndex(i=>i._uid===uid); if(idx===-1) return;
  const it=inv[idx]; bal+=it.p; inv.splice(idx,1); save(); updateBal();
  toast(`卖出 +${fmt(it.p)}`,'ok'); renderInv();
}

// ════════════════════════════════════════════
//  HISTORY
// ════════════════════════════════════════════
function addHist(item){
  hist.unshift({name:item.name,image:item.image,wear:item.wear,r:item.r,p:item.p,case:curCase?.name||'',ts:Date.now()});
  if(hist.length>300) hist.pop(); save();
}
function ago(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60) return '刚刚'; if(s<3600) return Math.floor(s/60)+'分钟前';
  if(s<86400) return Math.floor(s/3600)+'小时前'; return Math.floor(s/86400)+'天前';
}
function renderHist(){
  const list=$('hist-list');
  if(!hist.length){ list.innerHTML='<div class="empty" style="text-align:center;padding:60px;color:var(--muted)">暂无记录</div>'; return; }
  list.innerHTML='';
  hist.slice(0,150).forEach(h=>{
    const d=document.createElement('div'); d.className='hist-item';
    d.innerHTML=`<div class="hist-bar" style="background:${h.r?.c||'#555'}"></div>
      <img class="hist-img" src="${h.image}" onerror="this.style.opacity='.2'"/>
      <div class="hist-info"><div class="hist-name">${h.name}</div><div class="hist-meta">${h.case} · ${h.wear||''}</div></div>
      <div class="hist-price">${fmt(h.p)}</div>
      <div class="hist-time">${ago(h.ts)}</div>`;
    list.appendChild(d);
  });
}

// ════════════════════════════════════════════
//  SKINS PAGE
// ════════════════════════════════════════════
function buildRarityChips(){
  const rs=[{k:'all',l:'全部'},{k:'covert',l:'Covert',c:'#eb4b4b'},{k:'classified',l:'Classified',c:'#d32ce6'},{k:'restricted',l:'Restricted',c:'#8847ff'},{k:'milspec',l:'Mil-Spec',c:'#4b69ff'},{k:'industrial',l:'Industrial',c:'#5e98d9'},{k:'consumer',l:'Consumer',c:'#b0c3d9'}];
  const wrap=$('rarity-chips');
  rs.forEach(r=>{
    const b=document.createElement('button'); b.className='chip'+(r.k==='all'?' on':'');
    b.textContent=r.l; if(r.c) b.style.color=r.c;
    b.onclick=()=>{ rarityFilter=r.k; wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); filterSkins(); };
    wrap.appendChild(b);
  });
}

function initSkinsPage(skins){
  skinsFiltered=[...skins]; skinsOffset=0;
  const wrap=$('skins-wrap'); wrap.innerHTML='';
  const grid=document.createElement('div'); grid.className='skins-grid'; grid.id='skins-grid';
  wrap.appendChild(grid);
  const sentinel=document.createElement('div'); sentinel.id='skins-sentinel'; wrap.appendChild(sentinel);
  const obs=new IntersectionObserver(entries=>{ if(entries[0].isIntersecting) loadSkins(); },{rootMargin:'300px'});
  obs.observe(sentinel);
  loadSkins();
}

function filterSkins(){
  const q=$('skin-q').value.toLowerCase();
  skinsFiltered=allSkins.filter(s=>{
    const r=RARITY[s.rarity?.id]||{}; 
    return s.name.toLowerCase().includes(q)&&(rarityFilter==='all'||r.k===rarityFilter);
  });
  skinsOffset=0;
  const grid=$('skins-grid'); if(grid) grid.innerHTML='';
  loadSkins();
}

function loadSkins(){
  const grid=$('skins-grid'); if(!grid) return;
  const chunk=skinsFiltered.slice(skinsOffset,skinsOffset+PER_PAGE);
  chunk.forEach(s=>{
    const r=RARITY[s.rarity?.id]||{l:'',c:'#555',k:'consumer'};
    const d=document.createElement('div'); d.className='skin-card'; d.style.borderColor=r.c;
    d.innerHTML=`<img src="${s.image}" loading="lazy" onerror="this.style.opacity='.2'"/>
      <div class="sk-name">${s.name}</div>
      <div class="sk-rarity" style="color:${r.c}">${r.l}</div>`;
    grid.appendChild(d);
  });
  skinsOffset+=chunk.length;
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════
updateBal();
load();
</script>
</body>
</html>
