<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>CS2 VAULT — 模拟开箱</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0c10;--s1:#13141a;--s2:#1a1c25;--s3:#212430;
  --border:#2c2f40;--accent:#e8a838;--accent2:#ffd166;
  --txt:#dde1f0;--muted:#6b7090;--danger:#e85555;--ok:#43e87a;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

/* HEADER */
header{position:sticky;top:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:60px;background:rgba(11,12,16,.95);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:900;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;user-select:none}
.hdr-r{display:flex;align-items:center;gap:12px}
.bal-box{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:5px 14px}
.bal-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bal-val{font-size:16px;font-weight:800;color:var(--accent)}
.btn-topup{cursor:pointer;background:linear-gradient(135deg,#e8a838,#ffd166);color:#1a1000;font-size:12px;font-weight:800;border:none;border-radius:6px;padding:7px 14px;transition:filter .2s,transform .15s}
.btn-topup:hover{filter:brightness(1.1);transform:translateY(-1px)}

/* NAV */
nav{display:flex;gap:2px;padding:0 24px;background:var(--s1);border-bottom:1px solid var(--border);overflow-x:auto}
.nt{padding:12px 18px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s,border-color .2s;text-transform:uppercase;letter-spacing:.03em}
.nt:hover{color:var(--txt)}
.nt.on{color:var(--accent);border-bottom-color:var(--accent)}

/* PAGES */
.page{display:none;padding:24px}
.page.on{display:block}

/* STATUS BAR */
#status-bar{background:var(--s2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;margin-bottom:18px;font-size:13px;display:flex;align-items:center;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.loading{background:var(--accent);animation:pulse 1s ease infinite}
.dot.ok{background:var(--ok)}
.dot.err{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* SEC TITLE */
.st{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:16px;display:flex;align-items:center;gap:10px}
.st::after{content:'';flex:1;height:1px;background:var(--border)}

/* SEARCH / CHIP BAR */
.bar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.si{flex:1;min-width:180px;background:var(--s2);border:1px solid var(--border);color:var(--txt);padding:9px 14px;border-radius:8px;font-size:13px;outline:none;transition:border-color .2s}
.si:focus{border-color:var(--accent)}
.si::placeholder{color:var(--muted)}
.chip{padding:5px 12px;background:var(--s2);border:1px solid var(--border);border-radius:20px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.chip:hover,.chip.on{background:rgba(232,168,56,.12);border-color:var(--accent);color:var(--accent)}

/* CASES GRID */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:13px}
.cc{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:16px 12px 12px;cursor:pointer;text-align:center;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.cc::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(232,168,56,.06),transparent);opacity:0;transition:opacity .2s}
.cc:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 10px 28px rgba(232,168,56,.13)}
.cc:hover::after{opacity:1}
.cc-badge{position:absolute;top:7px;right:7px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;text-transform:uppercase;background:rgba(232,168,56,.15);color:var(--accent)}
.cc img{width:110px;height:83px;object-fit:contain;display:block;margin:0 auto 11px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.55));transition:transform .2s}
.cc:hover img{transform:scale(1.06)}
.cc-name{font-size:12px;font-weight:700;line-height:1.35;margin-bottom:8px}
.cc-price{font-size:14px;font-weight:800;color:var(--accent)}

/* LOADING */
.ld{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 20px;gap:13px;color:var(--muted)}
.sp{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* MODAL */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.84);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.ov.on{display:flex}
.modal{background:var(--s1);border:1px solid var(--border);border-radius:16px;width:92vw;max-width:860px;max-height:92vh;overflow-y:auto;padding:26px;position:relative}
.mx{position:absolute;top:13px;right:14px;background:none;border:none;color:var(--muted);font-size:21px;cursor:pointer;line-height:1;transition:color .2s}
.mx:hover{color:var(--danger)}
.mt{display:flex;gap:20px;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap}
.mc-img{width:120px;height:90px;object-fit:contain;filter:drop-shadow(0 5px 12px rgba(0,0,0,.6));flex-shrink:0}
.mi-title{font-size:20px;font-weight:900;color:var(--accent);margin-bottom:4px}
.mi-sub{font-size:12px;color:var(--muted)}
.mi-sub span{color:var(--txt)}
.sub-t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:9px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(95px,1fr));gap:7px;margin-bottom:16px}
.it{background:var(--s2);border-radius:7px;padding:8px 6px;text-align:center;border:1px solid var(--border)}
.it img{width:62px;height:47px;object-fit:contain;display:block;margin:0 auto 5px}
.it .tn{font-size:9px;line-height:1.3;color:var(--txt)}
.it .tb{height:2px;border-radius:2px;margin-top:5px}
.or{display:flex;align-items:center;gap:9px;margin-top:16px;flex-wrap:wrap}
.qb{display:flex;gap:5px}
.qbtn{padding:7px 12px;background:var(--s2);border:1px solid var(--border);border-radius:7px;color:var(--txt);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s}
.qbtn.on,.qbtn:hover{background:rgba(232,168,56,.12);border-color:var(--accent);color:var(--accent)}
.btn-open{flex:1;min-width:130px;padding:11px 20px;background:linear-gradient(135deg,#e8a838,#ffd166);color:#1a1000;font-size:14px;font-weight:900;border:none;border-radius:8px;cursor:pointer;letter-spacing:.04em;text-transform:uppercase;transition:filter .2s,transform .15s}
.btn-open:hover{filter:brightness(1.1);transform:translateY(-1px)}
.ct{font-size:12px;color:var(--muted)}

/* SPIN */
.sov{display:none;position:fixed;inset:0;background:rgba(7,8,12,.96);z-index:300;flex-direction:column;align-items:center;justify-content:center}
.sov.on{display:flex}
.slbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:24px}
.tw{width:100%;max-width:800px;overflow:hidden;padding:0 20px;position:relative}
.tw::before,.tw::after{content:'';position:absolute;top:0;bottom:0;width:120px;z-index:2;pointer-events:none}
.tw::before{left:20px;background:linear-gradient(to right,rgba(7,8,12,.95),transparent)}
.tw::after{right:20px;background:linear-gradient(to left,rgba(7,8,12,.95),transparent)}
.ptr{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:3px;background:var(--accent);z-index:5;box-shadow:0 0 16px var(--accent)}
.ptr::before{content:'';position:absolute;top:-7px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-top-color:var(--accent)}
.ptr::after{content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-bottom-color:var(--accent)}
.track{display:flex;gap:8px;will-change:transform;padding:0 50%}
.sc{flex-shrink:0;width:130px;background:var(--s1);border:2px solid var(--border);border-radius:9px;padding:11px 7px;text-align:center}
.sc img{width:90px;height:68px;object-fit:contain;display:block;margin:0 auto 5px}
.sc .sn{font-size:9px;font-weight:700;line-height:1.3}

/* RESULT */
.rp{display:none;flex-direction:column;align-items:center;gap:16px;margin-top:30px;text-align:center}
.rp.on{display:flex}
.rc{background:var(--s1);border:2px solid;border-radius:14px;padding:28px 40px;position:relative;overflow:hidden}
.rc::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,currentColor,transparent 65%);opacity:.07}
.rc img{width:180px;height:135px;object-fit:contain;display:block;margin:0 auto 14px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}
.rn{font-size:19px;font-weight:900}
.rr{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.rw{font-size:13px;color:var(--muted);margin-top:4px}
.rf{font-size:11px;color:var(--muted);margin-top:2px}
.rprice{font-size:16px;font-weight:800;color:var(--ok);margin-top:7px}
.ra{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
.bsell{padding:9px 20px;background:rgba(67,232,122,.1);border:1px solid var(--ok);color:var(--ok);font-size:13px;font-weight:800;border-radius:7px;cursor:pointer;transition:background .2s}
.bsell:hover{background:rgba(67,232,122,.22)}
.bagain{padding:9px 20px;background:linear-gradient(135deg,#e8a838,#ffd166);color:#1a1000;font-size:13px;font-weight:900;border:none;border-radius:7px;cursor:pointer;transition:filter .2s}
.bagain:hover{filter:brightness(1.1)}
.bclose{padding:9px 16px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:13px;border-radius:7px;cursor:pointer;transition:all .2s}
.bclose:hover{color:var(--txt);border-color:var(--txt)}

/* MULTI */
.mp{display:none;flex-direction:column;align-items:center;gap:14px;width:92%;max-width:860px;margin-top:24px}
.mp.on{display:flex}
.mhdr{font-size:16px;font-weight:900;color:var(--accent)}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:9px;width:100%}
.mcard{background:var(--s1);border:2px solid;border-radius:9px;padding:10px 7px;text-align:center;animation:fu .3s ease both}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.mcard img{width:76px;height:57px;object-fit:contain;display:block;margin:0 auto 5px}
.mc-n{font-size:10px;font-weight:700;line-height:1.3}
.mc-w{font-size:9px;color:var(--muted);margin-top:2px}
.mtotal{font-size:13px;color:var(--muted)}
.mtotal span{color:var(--ok);font-weight:800}

/* INVENTORY */
.srow{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.sb{background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:13px 18px;min-width:125px}
.sl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.sv{font-size:21px;font-weight:900;color:var(--accent);margin-top:3px}
.ig2{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px}
.icard{background:var(--s1);border:2px solid;border-radius:9px;padding:10px 7px;text-align:center;position:relative;transition:transform .15s,box-shadow .15s}
.icard:hover{transform:translateY(-3px);box-shadow:0 5px 18px rgba(0,0,0,.4)}
.icard img{width:76px;height:57px;object-fit:contain;display:block;margin:0 auto 6px}
.ic-n{font-size:10px;font-weight:700;line-height:1.3}
.ic-w{font-size:9px;color:var(--muted);margin-top:2px}
.ic-sell{position:absolute;top:4px;right:4px;background:rgba(67,232,122,.14);border:none;border-radius:4px;color:var(--ok);font-size:9px;font-weight:800;padding:2px 5px;cursor:pointer;display:none;transition:background .2s}
.icard:hover .ic-sell{display:block}
.ic-sell:hover{background:rgba(67,232,122,.3)}
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}

/* HISTORY */
.hl{display:flex;flex-direction:column;gap:8px}
.hi{display:flex;align-items:center;gap:13px;background:var(--s1);border:1px solid var(--border);border-radius:9px;padding:11px 14px;animation:sl .3s ease}
@keyframes sl{from{opacity:0;transform:translateX(-8px)}to{opacity:1}}
.hbar{width:3px;align-self:stretch;border-radius:4px;flex-shrink:0}
.himg{width:58px;height:44px;object-fit:contain;flex-shrink:0}
.hinfo{flex:1}
.hname{font-size:13px;font-weight:800}
.hmeta{font-size:11px;color:var(--muted);margin-top:2px}
.hprice{font-size:14px;font-weight:800;color:var(--ok)}
.htime{font-size:10px;color:var(--muted);flex-shrink:0}

/* SKINS */
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px}
.skcard{background:var(--s1);border:2px solid;border-radius:9px;padding:10px 7px;text-align:center;transition:transform .15s,box-shadow .15s}
.skcard:hover{transform:translateY(-3px);box-shadow:0 5px 18px rgba(0,0,0,.4)}
.skcard img{width:76px;height:57px;object-fit:contain;display:block;margin:0 auto 6px}
.sk-n{font-size:10px;font-weight:700;line-height:1.3}
.sk-r{font-size:9px;margin-top:3px;font-weight:600}

/* TOAST */
.toast{position:fixed;bottom:22px;right:22px;background:var(--s2);border:1px solid var(--border);padding:12px 16px;border-radius:9px;font-size:13px;z-index:999;transform:translateY(80px);opacity:0;transition:transform .3s,opacity .3s;max-width:270px;line-height:1.4}
.toast.on{transform:translateY(0);opacity:1}
.toast.ok{border-color:var(--ok);color:var(--ok)}
.toast.err{border-color:var(--danger);color:var(--danger)}

@media(max-width:580px){
  header{padding:0 12px}.logo{font-size:15px}
  nav{padding:0 6px}.nt{padding:10px 10px;font-size:11px}
  .page{padding:14px}.rc{padding:20px 14px}
  .sc{width:108px}
}
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 40 40" fill="none">
      <polygon points="20,3 37,12 37,28 20,37 3,28 3,12" fill="rgba(232,168,56,.12)" stroke="#e8a838" stroke-width="1.5"/>
      <circle cx="20" cy="20" r="6" fill="#e8a838"/>
      <circle cx="20" cy="20" r="3" fill="#1a1000"/>
    </svg>
    CS2 VAULT
  </div>
  <div class="hdr-r">
    <div class="bal-box">
      <span class="bal-lbl">余额</span>
      <span class="bal-val" id="bal">$1,000.00</span>
    </div>
    <button class="btn-topup" onclick="topUp()">+ 充值</button>
  </div>
</header>

<nav>
  <div class="nt on" onclick="goPage('cases',this)">🎁 武器箱</div>
  <div class="nt" onclick="goPage('skins',this)">🔫 皮肤库</div>
  <div class="nt" onclick="goPage('inv',this)">🎒 背包</div>
  <div class="nt" onclick="goPage('hist',this)">📜 记录</div>
</nav>

<!-- CASES -->
<div class="page on" id="page-cases">
  <div id="status-bar"><div class="dot loading" id="dot"></div><span id="status-txt">正在加载数据，请稍候…</span></div>
  <div class="st">选择武器箱</div>
  <div class="bar">
    <input class="si" id="cq" placeholder="🔍 搜索武器箱名称…" oninput="filterCases()"/>
    <div id="tc" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
  <div id="cw"><div class="ld"><div class="sp"></div><span>连接数据源…</span></div></div>
</div>

<!-- SKINS -->
<div class="page" id="page-skins">
  <div class="st">全部皮肤</div>
  <div class="bar">
    <input class="si" id="sq" placeholder="🔍 搜索皮肤名称…" oninput="filterSkins()"/>
    <div id="rc" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
  <div id="sw"><div class="ld"><div class="sp"></div><span>加载皮肤库…</span></div></div>
</div>

<!-- INVENTORY -->
<div class="page" id="page-inv">
  <div class="st">我的背包</div>
  <div class="srow">
    <div class="sb"><div class="sl">物品数</div><div class="sv" id="sc">0</div></div>
    <div class="sb"><div class="sl">总价值</div><div class="sv" id="sv">$0</div></div>
    <div class="sb"><div class="sl">开箱次数</div><div class="sv" id="so">0</div></div>
    <div class="sb"><div class="sl">最贵物品</div><div class="sv" id="sbest">—</div></div>
  </div>
  <div class="bar"><div id="ic" style="display:flex;gap:6px;flex-wrap:wrap"></div></div>
  <div class="ig2" id="ig"></div>
</div>

<!-- HISTORY -->
<div class="page" id="page-hist">
  <div class="st">开箱记录</div>
  <div class="hl" id="hl"></div>
</div>

<!-- CASE MODAL -->
<div class="ov" id="cmo">
  <div class="modal">
    <button class="mx" onclick="closeModal()">✕</button>
    <div class="mt">
      <img id="mci" src="" class="mc-img"/>
      <div>
        <div class="mi-title" id="mct"></div>
        <div class="mi-sub" id="mcs"></div>
      </div>
    </div>
    <div class="sub-t">箱内物品</div>
    <div class="ig" id="mit"></div>
    <div class="sub-t" id="rlt" style="color:#e4ae39">★ 稀有特殊物品</div>
    <div class="ig" id="mir"></div>
    <div class="or">
      <div class="qb">
        <button class="qbtn on" onclick="setQty(1,this)">×1</button>
        <button class="qbtn" onclick="setQty(3,this)">×3</button>
        <button class="qbtn" onclick="setQty(5,this)">×5</button>
        <button class="qbtn" onclick="setQty(10,this)">×10</button>
      </div>
      <button class="btn-open" id="bop" onclick="doOpen()">🔑 开箱</button>
      <span class="ct" id="ctxt"></span>
    </div>
  </div>
</div>

<!-- SPIN -->
<div class="sov" id="sov">
  <div class="slbl" id="slbl">🎰 开箱中…</div>
  <div class="tw" id="tw">
    <div class="ptr"></div>
    <div class="track" id="track"></div>
  </div>
  <div class="rp" id="rp">
    <div class="rc" id="rc">
      <img id="ri" src=""/>
      <div class="rn" id="rn"></div>
      <div class="rr" id="rr"></div>
      <div class="rw" id="rw"></div>
      <div class="rf" id="rf"></div>
      <div class="rprice" id="rprice"></div>
    </div>
    <div class="ra">
      <button class="bsell" id="bs1" onclick="sell1()">💰 卖出</button>
      <button class="bagain" onclick="again()">🔑 再开一次</button>
      <button class="bclose" onclick="closeSpin()">关闭</button>
    </div>
  </div>
  <div class="mp" id="mpanel">
    <div class="mhdr">开箱结果</div>
    <div class="mg" id="mgrid"></div>
    <div class="mtotal" id="mtot"></div>
    <div class="ra">
      <button class="bsell" onclick="sellAll()">💰 全部卖出</button>
      <button class="bagain" onclick="again()">🔑 再开一次</button>
      <button class="bclose" onclick="closeSpin()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════
//  数据源配置（多源 fallback，适配国内）
// ═══════════════════════════════════════
const SOURCES = [
  // jsDelivr 在国内有节点，最稳
  'https://cdn.jsdelivr.net/gh/ByMykel/CSGO-API@main/public/api/en',
  // jsDelivr 备用节点
  'https://fastly.jsdelivr.net/gh/ByMykel/CSGO-API@main/public/api/en',
  // GitHub Raw 兜底
  'https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en',
];

// 图片代理：Steam CDN 在国内通常可以访问
// 如果加载失败自动用备用 svg
const IMG_FALLBACK = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="90" height="68" viewBox="0 0 90 68"><rect width="90" height="68" fill="%231a1c25"/><text x="45" y="38" text-anchor="middle" fill="%236b7090" font-size="11">NO IMG</text></svg>';

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
let bal   = +localStorage.getItem('v_bal') || 1000;
let inv   = JSON.parse(localStorage.getItem('v_inv') || '[]');
let hist  = JSON.parse(localStorage.getItem('v_hist') || '[]');
let opens = +localStorage.getItem('v_opens') || 0;

let allCases=[], allSkins=[];
let curCase=null, qty=1;
let lastItem=null, lastMulti=null;
let cTypeF='all', rarF='all', invF='all';
let skOff=0, skFiltered=[];
const SK_PER=100;

const RARITY = {
  rarity_consumer_weapon:  {l:'Consumer Grade', c:'#b0c3d9',k:'consumer'},
  rarity_common:           {l:'Consumer Grade', c:'#b0c3d9',k:'consumer'},
  rarity_uncommon_weapon:  {l:'Industrial Grade',c:'#5e98d9',k:'industrial'},
  rarity_rare_weapon:      {l:'Mil-Spec Grade', c:'#4b69ff',k:'milspec'},
  rarity_mythical_weapon:  {l:'Restricted',     c:'#8847ff',k:'restricted'},
  rarity_legendary_weapon: {l:'Classified',     c:'#d32ce6',k:'classified'},
  rarity_ancient_weapon:   {l:'Covert',         c:'#eb4b4b',k:'covert'},
  rarity_ancient:          {l:'Covert',         c:'#eb4b4b',k:'covert'},
  rarity_contraband:       {l:'Contraband',     c:'#e4ae39',k:'gold'},
};
const WEAR=['Factory New','Minimal Wear','Field-Tested','Well-Worn','Battle-Scarred'];
const CASE_PRICE=2.5;

// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
const $=id=>document.getElementById(id);
const fmt=n=>'$'+parseFloat(n).toFixed(2);
function save(){
  localStorage.setItem('v_bal',bal.toFixed(2));
  localStorage.setItem('v_inv',JSON.stringify(inv));
  localStorage.setItem('v_hist',JSON.stringify(hist));
  localStorage.setItem('v_opens',opens);
}
function updateBal(){$('bal').textContent=fmt(bal)}
function toast(msg,type=''){
  const t=$('toast');t.textContent=msg;
  t.className='toast on'+(type?' '+type:'');
  clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',2800);
}
function topUp(){bal+=100;save();updateBal();toast('+$100 充值成功','ok')}
function goPage(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nt').forEach(n=>n.classList.remove('on'));
  $('page-'+id).classList.add('on');el.classList.add('on');
  if(id==='inv')renderInv();
  if(id==='hist')renderHist();
}
function rar(item){return RARITY[item?.rarity?.id]||{l:'',c:'#555',k:'consumer'}}
function price(k,wear){
  const b={consumer:.05,industrial:.12,milspec:.4,restricted:1.5,classified:9,covert:50,gold:220};
  const wm=[1.3,1.15,.95,.75,.55];const wi=WEAR.indexOf(wear);
  return +((b[k]||.1)*(wi>=0?wm[wi]:1)*(.65+Math.random()*.7)).toFixed(2);
}
function ago(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return '刚刚';if(s<3600)return Math.floor(s/60)+'分钟前';
  if(s<86400)return Math.floor(s/3600)+'小时前';return Math.floor(s/86400)+'天前';
}

// ═══════════════════════════════════════
//  FETCH WITH FALLBACK
// ═══════════════════════════════════════
function setStatus(state, msg){
  const dot=$('dot'), txt=$('status-txt');
  dot.className='dot '+state;
  txt.textContent=msg;
}

async function fetchWithFallback(path){
  for(let i=0;i<SOURCES.length;i++){
    const url=SOURCES[i]+path;
    try{
      setStatus('loading',`尝试数据源 ${i+1}/${SOURCES.length}…`);
      const r=await fetch(url,{signal:AbortSignal.timeout(8000)});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const data=await r.json();
      setStatus('ok',`数据加载成功（源 ${i+1}）✓`);
      return data;
    }catch(e){
      console.warn(`Source ${i+1} failed:`,e.message);
    }
  }
  throw new Error('所有数据源均不可用，请检查网络或使用代理');
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
async function load(){
  try{
    const [crates,skins]=await Promise.all([
      fetchWithFallback('/crates.json'),
      fetchWithFallback('/skins.json'),
    ]);
    allCases=crates.filter(c=>c.contains&&c.contains.length>0&&
      ['Case','Souvenir','Capsule','Package'].includes(c.type));
    allSkins=skins;
    buildTypeChips();buildRarChips();buildInvChips();
    renderCases(allCases);initSkins(allSkins);
  }catch(e){
    setStatus('err','加载失败：'+e.message);
    $('cw').innerHTML=`<div style="color:var(--danger);padding:50px;text-align:center;line-height:2">
      ⚠️ 数据加载失败<br>
      <small>${e.message}</small><br><br>
      <b>国内用户：</b>需要挂代理或 VPN 访问<br>
      数据源：jsDelivr / GitHub Raw
      <br><br><button onclick="load()" style="padding:8px 20px;background:var(--accent);color:#1a1000;font-weight:800;border:none;border-radius:6px;cursor:pointer">重试</button>
    </div>`;
  }
}

// ═══════════════════════════════════════
//  CASES PAGE
// ═══════════════════════════════════════
function buildTypeChips(){
  const types=['全部','Case','Souvenir','Capsule','Package'];
  const w=$('tc');
  types.forEach(t=>{
    const b=document.createElement('button');b.className='chip'+(t==='全部'?' on':'');
    b.textContent=t;
    b.onclick=()=>{cTypeF=t==='全部'?'all':t;w.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');filterCases()};
    w.appendChild(b);
  });
}
function filterCases(){
  const q=$('cq').value.toLowerCase();
  renderCases(allCases.filter(c=>c.name.toLowerCase().includes(q)&&(cTypeF==='all'||c.type===cTypeF)));
}
function renderCases(list){
  const w=$('cw');
  if(!list.length){w.innerHTML='<div style="color:var(--muted);padding:50px;text-align:center">没有匹配的武器箱</div>';return}
  const g=document.createElement('div');g.className='cg';
  list.forEach(c=>{
    const d=document.createElement('div');d.className='cc';
    d.innerHTML=`${c.type?`<div class="cc-badge">${c.type}</div>`:''}
      <img src="${c.image}" loading="lazy" onerror="this.src='${IMG_FALLBACK}'"/>
      <div class="cc-name">${c.name}</div>
      <div class="cc-price">${fmt(CASE_PRICE)}</div>`;
    d.onclick=()=>openModal(c);g.appendChild(d);
  });
  w.innerHTML='';w.appendChild(g);
}

// ═══════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════
function openModal(c){
  curCase=c;qty=1;
  document.querySelectorAll('.qbtn').forEach((b,i)=>b.classList.toggle('on',i===0));
  $('mci').src=c.image;$('mct').textContent=c.name;
  $('mcs').innerHTML=`类型 <span>${c.type||'—'}</span> · 首发 <span>${c.first_sale_date||'—'}</span>`;
  const ig=$('mit');ig.innerHTML='';
  (c.contains||[]).forEach(it=>{
    const r=rar(it);const d=document.createElement('div');d.className='it';
    d.innerHTML=`<img src="${it.image}" loading="lazy" onerror="this.src='${IMG_FALLBACK}'"/>
      <div class="tn">${it.name}</div><div class="tb" style="background:${r.c}"></div>`;
    ig.appendChild(d);
  });
  const rg=$('mir'),rl=$('rlt');rg.innerHTML='';
  if(c.contains_rare&&c.contains_rare.length){
    rl.style.display='';
    c.contains_rare.forEach(it=>{
      const d=document.createElement('div');d.className='it';
      d.innerHTML=`<img src="${it.image}" loading="lazy" onerror="this.src='${IMG_FALLBACK}'"/>
        <div class="tn" style="color:#e4ae39">${it.name}</div><div class="tb" style="background:#e4ae39"></div>`;
      rg.appendChild(d);
    });
  }else rl.style.display='none';
  updateCost();$('cmo').classList.add('on');
}
function closeModal(){$('cmo').classList.remove('on')}
$('cmo').onclick=e=>{if(e.target===$('cmo'))closeModal()};
function setQty(n,b){qty=n;document.querySelectorAll('.qbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');updateCost()}
function updateCost(){$('ctxt').textContent=`花费: ${fmt(CASE_PRICE*qty)}`;$('bop').textContent=`🔑 开箱 ×${qty}`}

// ═══════════════════════════════════════
//  ROLL
// ═══════════════════════════════════════
function roll(c){
  const pool=[...(c.contains||[])],rare=[...(c.contains_rare||[])];
  const W={milspec:8000,restricted:1600,classified:320,covert:64,gold:26,consumer:100,industrial:100};
  const arr=[];
  pool.forEach(it=>{const k=rar(it).k;const w=W[k]||100;for(let i=0;i<w;i++)arr.push({...it,_rare:false})});
  if(rare.length){for(let i=0;i<W.gold;i++)arr.push({...rare[Math.floor(Math.random()*rare.length)],_rare:true})}
  const ch=arr[Math.floor(Math.random()*arr.length)];
  const wi=Math.floor(Math.random()*5),wear=WEAR[wi];
  const r=rar(ch);
  return{...ch,wear,flt:(Math.random()*.95+.01).toFixed(6),r,p:price(r.k,wear),_uid:Date.now()+Math.random().toString(36).slice(2)};
}

// ═══════════════════════════════════════
//  OPEN
// ═══════════════════════════════════════
function doOpen(){
  const cost=CASE_PRICE*qty;
  if(bal<cost){toast('余额不足，请充值！','err');return}
  bal-=cost;opens+=qty;save();updateBal();closeModal();
  qty===1?spinSingle():multiOpen();
}
function spinSingle(){
  const item=roll(curCase);lastItem=item;
  const track=$('track');track.style.transition='none';track.style.transform='translateX(0)';track.innerHTML='';
  const items=[];for(let i=0;i<58;i++)items.push(roll(curCase));items.push(item);
  const IW=138;
  items.forEach(it=>{
    const d=document.createElement('div');d.className='sc';d.style.borderColor=it.r.c;
    d.innerHTML=`<img src="${it.image}" loading="lazy" onerror="this.src='${IMG_FALLBACK}'"/><div class="sn">${it.name}</div>`;
    track.appendChild(d);
  });
  $('rp').classList.remove('on');$('mpanel').classList.remove('on');
  $('tw').style.display='';$('slbl').textContent='🎰 开箱中…';$('sov').classList.add('on');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const target=58*IW+IW/2+(Math.random()-.5)*50;
    track.style.transition='transform 4s cubic-bezier(0.15,1,0.25,1)';
    track.style.transform=`translateX(calc(-${target}px))`;
    setTimeout(()=>showSingle(item),4300);
  }));
}
function showSingle(item){
  $('ri').src=item.image;
  $('rn').textContent=item.name;
  $('rr').textContent=item.r.l;$('rr').style.color=item.r.c;
  $('rw').textContent=item.wear;$('rf').textContent='Float: '+item.flt;
  $('rprice').textContent=fmt(item.p);
  const card=$('rc');card.style.borderColor=item.r.c;card.style.color=item.r.c;
  $('bs1').textContent=`💰 卖出 ${fmt(item.p)}`;
  addInv(item);addHist(item);$('rp').classList.add('on');
}
function multiOpen(){
  const results=[];for(let i=0;i<qty;i++)results.push(roll(curCase));
  lastMulti=results;results.forEach(r=>{addInv(r);addHist(r)});save();
  const g=$('mgrid');g.innerHTML='';
  results.forEach((it,i)=>{
    const d=document.createElement('div');d.className='mcard';d.style.borderColor=it.r.c;d.style.animationDelay=(i*55)+'ms';
    d.innerHTML=`<img src="${it.image}" loading="lazy" onerror="this.src='${IMG_FALLBACK}'"/><div class="mc-n">${it.name}</div><div class="mc-w">${it.wear}</div>`;
    g.appendChild(d);
  });
  const total=results.reduce((s,r)=>s+r.p,0);
  $('mtot').innerHTML=`总价值: <span>${fmt(total)}</span>`;
  $('tw').style.display='none';$('rp').classList.remove('on');$('mpanel').classList.add('on');
  $('slbl').textContent='';$('sov').classList.add('on');
}
function sell1(){
  if(!lastItem)return;
  bal+=lastItem.p;const idx=inv.findIndex(i=>i._uid===lastItem._uid);
  if(idx!==-1)inv.splice(idx,1);
  save();updateBal();toast(`卖出 +${fmt(lastItem.p)}`,'ok');closeSpin();
}
function sellAll(){
  if(!lastMulti)return;
  let t=0;lastMulti.forEach(it=>{t+=it.p;const idx=inv.findIndex(i=>i._uid===it._uid);if(idx!==-1)inv.splice(idx,1)});
  bal+=t;save();updateBal();toast(`全部卖出 +${fmt(t)}`,'ok');closeSpin();
}
function again(){closeSpin();openModal(curCase)}
function closeSpin(){
  $('sov').classList.remove('on');$('rp').classList.remove('on');$('mpanel').classList.remove('on');
  lastItem=null;lastMulti=null;
}

// ═══════════════════════════════════════
//  INVENTORY
// ═══════════════════════════════════════
function addInv(item){inv.unshift(item);save()}
function buildInvChips(){
  const rs=[{k:'all',l:'全部',c:'var(--txt)'},{k:'covert',l:'Covert',c:'#eb4b4b'},{k:'classified',l:'Classified',c:'#d32ce6'},{k:'restricted',l:'Restricted',c:'#8847ff'},{k:'milspec',l:'Mil-Spec',c:'#4b69ff'},{k:'gold',l:'★ 特殊',c:'#e4ae39'}];
  const w=$('ic');
  rs.forEach(r=>{
    const b=document.createElement('button');b.className='chip'+(r.k==='all'?' on':'');
    b.textContent=r.l;b.style.color=r.c;
    b.onclick=()=>{invF=r.k;w.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderInv()};
    w.appendChild(b);
  });
}
function renderInv(){
  let list=invF==='all'?[...inv]:inv.filter(i=>i.r?.k===invF);
  $('sc').textContent=inv.length;
  $('sv').textContent=fmt(inv.reduce((s,i)=>s+(i.p||0),0));
  $('so').textContent=opens;
  const best=inv.reduce((b,i)=>i.p>(b?.p||0)?i:b,null);
  $('sbest').textContent=best?fmt(best.p):'—';
  const g=$('ig');g.innerHTML='';
  if(!list.length){
    g.innerHTML=`<div class="empty">${invF!=='all'?'该稀有度暂无物品':'背包是空的，快去开箱！'}</div>`;return;
  }
  list.forEach(item=>{
    const d=document.createElement('div');d.className='icard';d.style.borderColor=item.r?.c||'#555';
    d.innerHTML=`<button class="ic-sell" onclick="sellInv('${item._uid}',event)">卖 ${fmt(item.p)}</button>
      <img src="${item.image}" loading="lazy" onerror="this.src='${IMG_FALLBACK}'"/>
      <div class="ic-n">${item.name}</div><div class="ic-w">${item.wear||''}</div>`;
    g.appendChild(d);
  });
}
function sellInv(uid,e){
  e.stopPropagation();
  const idx=inv.findIndex(i=>i._uid===uid);if(idx===-1)return;
  const it=inv[idx];bal+=it.p;inv.splice(idx,1);save();updateBal();
  toast(`卖出 +${fmt(it.p)}`,'ok');renderInv();
}

// ═══════════════════════════════════════
//  HISTORY
// ═══════════════════════════════════════
function addHist(item){
  hist.unshift({name:item.name,image:item.image,wear:item.wear,r:item.r,p:item.p,case:curCase?.name||'',ts:Date.now()});
  if(hist.length>300)hist.pop();save();
}
function renderHist(){
  const l=$('hl');
  if(!hist.length){l.innerHTML='<div style="color:var(--muted);padding:50px;text-align:center">暂无记录</div>';return}
  l.innerHTML='';
  hist.slice(0,150).forEach(h=>{
    const d=document.createElement('div');d.className='hi';
    d.innerHTML=`<div class="hbar" style="background:${h.r?.c||'#555'}"></div>
      <img class="himg" src="${h.image}" onerror="this.src='${IMG_FALLBACK}'"/>
      <div class="hinfo"><div class="hname">${h.name}</div><div class="hmeta">${h.case} · ${h.wear||''}</div></div>
      <div class="hprice">${fmt(h.p)}</div><div class="htime">${ago(h.ts)}</div>`;
    l.appendChild(d);
  });
}

// ═══════════════════════════════════════
//  SKINS PAGE
// ═══════════════════════════════════════
function buildRarChips(){
  const rs=[{k:'all',l:'全部'},{k:'covert',l:'Covert',c:'#eb4b4b'},{k:'classified',l:'Classified',c:'#d32ce6'},{k:'restricted',l:'Restricted',c:'#8847ff'},{k:'milspec',l:'Mil-Spec',c:'#4b69ff'},{k:'industrial',l:'Industrial',c:'#5e98d9'},{k:'consumer',l:'Consumer',c:'#b0c3d9'}];
  const w=$('rc');
  rs.forEach(r=>{
    const b=document.createElement('button');b.className='chip'+(r.k==='all'?' on':'');
    b.textContent=r.l;if(r.c)b.style.color=r.c;
    b.onclick=()=>{rarF=r.k;w.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');filterSkins()};
    w.appendChild(b);
  });
}
function initSkins(skins){
  skFiltered=[...skins];skOff=0;
  const w=$('sw');w.innerHTML='';
  const g=document.createElement('div');g.className='sg';g.id='sg';w.appendChild(g);
  const sen=document.createElement('div');sen.id='sen';w.appendChild(sen);
  new IntersectionObserver(en=>{if(en[0].isIntersecting)loadSkins()},{rootMargin:'300px'}).observe(sen);
  loadSkins();
}
function filterSkins(){
  const q=$('sq').value.toLowerCase();
  skFiltered=allSkins.filter(s=>{const r=RARITY[s.rarity?.id]||{};return s.name.toLowerCase().includes(q)&&(rarF==='all'||r.k===rarF)});
  skOff=0;const g=$('sg');if(g)g.innerHTML='';loadSkins();
}
function loadSkins(){
  const g=$('sg');if(!g)return;
  skFiltered.slice(skOff,skOff+SK_PER).forEach(s=>{
    const r=RARITY[s.rarity?.id]||{l:'',c:'#555',k:'consumer'};
    const d=document.createElement('div');d.className='skcard';d.style.borderColor=r.c;
    d.innerHTML=`<img src="${s.image}" loading="lazy" onerror="this.src='${IMG_FALLBACK}'"/>
      <div class="sk-n">${s.name}</div><div class="sk-r" style="color:${r.c}">${r.l}</div>`;
    g.appendChild(d);
  });
  skOff+=SK_PER;
}

// ═══════════════════════════════════════
//  START
// ═══════════════════════════════════════
updateBal();
load();
</script>
</body>
</html>
